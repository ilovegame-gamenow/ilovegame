<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>I LOVE GAME♪</title>
  <link rel="stylesheet" href="/header.css">
  <link rel="stylesheet" href="/article.css">
</head>

<body>

  <header></header>

  
  <main id="app">
    <div class="error">
      記事を読み込んでいます…
    </div>
  </main>
  <script src="/header.js"></script>
  <script src="/date-utils.js"></script>
  <script src="/image-utils.js"></script>
  <script src="/article-renderer.js"></script>
  <script>
    const esc = (value = "") =>
      String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    
    async function loadArticle() {
      const app = document.getElementById("app");

      try {
        const params =
          new URLSearchParams(window.location.search);

        const id = params.get("id");

        if (!id) {
          throw new Error("記事IDがありません");
        }

        const response = await fetch(`/api/news?id=${encodeURIComponent(id)}`);

        if (!response.ok) {
          throw new Error("記事を取得できませんでした");
        }

        const article = await response.json();

        if (!article) {
          throw new Error("記事が見つかりません");
        }

        const thumbnail = GameImage.getUrl(article.thumbnail_url, article.source_name);
        const updateTime = article.site_published_at || article.created_at || article.published_at;
        document.title =
          `${article.title} | I LOVE GAME♪`;
  
app.innerHTML = GameArticle.render(article) + `
  <a class="back" href="#" onclick="if(history.length>1){history.back();}else{location.href='/';}return false;">← 一覧に戻る</a>
`;

GameArticle.observeBody(app, article);
  
      } catch (error) {
        app.innerHTML = `
          <div class="error">
            <h2>記事を表示できませんでした</h2>
            <p>${esc(error.message)}</p>
            <p><a href="/">トップページへ戻る</a></p>
          </div>
        `;
      }
    }

    loadArticle();
  </script>

</body>
</html>
