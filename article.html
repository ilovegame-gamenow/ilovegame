<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>I LOVE GAME♪</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #fffaf3;
      color: #2b2b2b;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Hiragino Kaku Gothic ProN",
        "Yu Gothic",
        sans-serif;
    }

    main {
      max-width: 900px;
      margin: 35px auto 80px;
      padding: 0 20px;
    }

    .back {
      display: inline-block;
      margin-bottom: 24px;
      color: #e86512;
      font-weight: 700;
      text-decoration: none;
    }

    .article-card {
      background: #ffffff;
      border-radius: 24px;
      padding: 32px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.07);
    }

    .category {
      display: inline-block;
      background: #fff0e4;
      color: #e86512;
      border-radius: 999px;
      padding: 5px 12px;
      font-size: 13px;
      font-weight: 800;
      margin-bottom: 15px;
    }

    h1 {
      margin: 0 0 14px;
      font-size: clamp(25px, 5vw, 38px);
      line-height: 1.4;
    }

    .meta {
      color: #888;
      font-size: 14px;
      margin-bottom: 24px;
    }

    .hero {
      width: 100%;
      display: block;
      border-radius: 18px;
      margin: 0 0 30px;
    }

    .summary {
  font-size: 18px;
  font-weight: 700;
  line-height: 1.7;
  margin-bottom: 12px;
  padding: 18px 20px;
  background: #fff7f0;
  border-left: 5px solid #ff8a3d;
  border-radius: 12px;
}

   .body {
    font-size: 17px;
    line-height: 1.85;
    white-space: pre-line;
    word-break: normal;
    overflow-wrap: break-word;
    line-break: strict;
  }
    
    .point {
      margin-top: 12px;
      padding: 22px;
      background: #fff4e8;
      border-left: 6px solid #ff8a3d;
      border-radius: 14px;
    }

    .point-title {
      color: #e86512;
      font-weight: 900;
      margin-bottom: 8px;
    }

    .source {
      margin-top: 30px;
      padding-top: 22px;
      border-top: 1px solid #eee;
      text-align: right;
    }

    .source a {
      color: #e86512;
      font-weight: 700;
    }
    main > .back {
    display: inline-block;
    margin-top: 16px;
    }
    .error {
      text-align: center;
      padding: 70px 20px;
    }

    
@media (max-width: 600px) {
    main {
        margin-top: 20px;
        padding: 0 12px;
    }

    .article-card {
        padding: 22px 18px;
        border-radius: 18px;
    }
}
  
  </style>
  <link rel="stylesheet" href="/header.css">
</head>

<body>

  <header></header>

  
  <main id="app">
    <div class="error">
      記事を読み込んでいます…
    </div>
  </main>
  <script src="/header.js"></script>
  <script src="/date-utils.js"></script>
  <script>
    const esc = (value = "") =>
      String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    
function formatArticleText(text) {
    const width = Math.min(
        document.querySelector(".article-card")?.clientWidth || window.innerWidth,
        window.innerWidth
    );
    const charsPerLine = Math.max(12, Math.floor((width - 64) / 17));
    const target = Math.round(charsPerLine * 1.7);

    let count = 0;

    return String(text).replace(/([。！？♪])(?=\S)/g, (match) => {
        count += 1;
        return match;
    }).split(/(?<=[。！？♪])/).map(sentence => {
        count += sentence.length;
        if (count >= target) {
            count = 0;
            return sentence + "\n";
        }
        return sentence;
    }).join("").trim();
}

    async function loadArticle() {
      const app = document.getElementById("app");

      try {
        const params =
          new URLSearchParams(window.location.search);

        const id = params.get("id");

        if (!id) {
          throw new Error("記事IDがありません");
        }

        const response = await fetch("/api/news");

        if (!response.ok) {
          throw new Error("記事を取得できませんでした");
        }

        const articles = await response.json();

        const article = articles.find(
          item => String(item.id) === String(id)
        );

        if (!article) {
          throw new Error("記事が見つかりません");
        }

        const thumbnail = article.thumbnail_url
          ? `https://assets.topics.apps-jp.nintendo.com/image/${article.thumbnail_url}`
          : "";

        const updateTime = article.updated_at || article.created_at || article.published_at;
const updateLabel = GameDate.format(updateTime);
const timeColor = GameDate.color(updateTime);
        document.title =
          `${article.title} | I LOVE GAME♪`;

        app.innerHTML = `
          

          <article class="article-card">

            

            <h1>${esc(article.title)}</h1>

            <div class="meta">
  ${article.source_name ? esc(article.source_name) : ""}
  ${updateLabel ? ` ｜ <span class="game-date" style="color:${timeColor}">${esc(updateLabel)} 更新</span>` : ""}
</div>

            ${thumbnail
              ? `<img
                   class="hero"
                   src="${esc(thumbnail)}"
                   alt="${esc(article.title)}"
                 >`
              : ""}

            ${article.summary
              ? `<div class="summary">
                   ${esc(article.summary)}
                 </div>`
              : ""}

            <div class="body">
              

${esc(formatArticleText(
    (
        article.article_body ||
        article.summary ||
        ""
    ).trim()
))}


            </div>

            ${article.ilovegame_point
              ? `
                <div class="point">
                  <div class="point-title">
                    ここに注目♪
                  </div>
                  <div>
                    ${esc(article.ilovegame_point)}
                  </div>
                </div>
              `
              : ""}

            ${article.source_url
              ? `
                <div class="source">
                  情報元：
                  <a
                    href="${esc(article.source_url)}"
                    target="_blank"
                    rel="noopener noreferrer"
                  >
                    ${esc(
                      article.source_name ||
                      "公式サイト"
                    )}
                  </a>
                </div>
              `
              : ""}
        
          </article>
<a class="back" href="#" onclick="if(history.length>1){history.back();}else{location.href='/';}return false;">← 一覧に戻る</a>
        `;
      
const bodyElement = app.querySelector(".body");
const originalText = (
    article.article_body ||
    article.summary ||
    ""
).trim();

let previousWidth = 0;

const observer = new ResizeObserver(() => {
    const currentWidth = Math.round(bodyElement.clientWidth);

    if (currentWidth === previousWidth) return;
    previousWidth = currentWidth;

    bodyElement.textContent = formatArticleText(originalText);
});

observer.observe(bodyElement);

      } catch (error) {
        app.innerHTML = `
          <div class="error">
            <h2>記事を表示できませんでした</h2>
            <p>${esc(error.message)}</p>
            <p><a href="/">トップページへ戻る</a></p>
          </div>
        `;
      }
    }

    loadArticle();
  </script>

</body>
</html>
