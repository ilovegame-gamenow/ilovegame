<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>記事プレビュー | I LOVE GAME♪ 編集室</title>
  <link rel="stylesheet" href="/header.css">
  <link rel="stylesheet" href="/article.css">
</head>
<body data-page="editor">
  <header></header>

  <main id="app">
    <div class="error">記事を読み込んでいます…</div>
  </main>

  <script src="/header.js"></script>
  <script src="/date-utils.js"></script>
  <script src="/image-utils.js"></script>
  <script src="/article-renderer.js"></script>
  <script src="/editor-status.js"></script>
  <script src="/editor-save.js"></script>
  <script src="/editor-regenerate.js"></script>
  <script src="/editor-session.js"></script>
  <script>
    GameEditorSession.start();

    const app = document.getElementById("app");

    const esc = (value = "") =>
      String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

    async function loadArticle() {
      try {
        const params = new URLSearchParams(location.search);
        const id = params.get("id");

        if (!id || !/^[1-9]\d*$/.test(id)) {
          throw new Error("記事IDが正しくありません");
        }

        const response = await fetch(
          `/api/editor-detail?id=${encodeURIComponent(id)}`,
          {
            credentials: "same-origin",
            cache: "no-store"
          }
        );

        if (response.status === 401) {
          location.replace("/editor.html");
          return;
        }

        if (!response.ok) {
          throw new Error("記事を取得できませんでした");
        }

        const data = await response.json();
        const article = data.article;
        const draft = data.draft;
        const editable = draft || article;

        if (!article) {
          throw new Error("記事が見つかりません");
        }

        document.title =
          `${article.title} | I LOVE GAME♪ 編集室`;

        app.innerHTML = GameArticle.render({ ...article, ...editable }) + `
  <section class="editor-management" aria-label="記事管理情報">
    
<div class="editor-management-header">
  <h2>記事管理</h2>
  <span class="editor-importance">
    AI評価：${article.importance == null ? "未評価" : `${article.importance}点`}
  </span>
</div>

<div class="editor-status-row">
  <span class="editor-status-label">掲載状態</span>
  <span
    id="articleStatus"
    class="editor-status-badge"
    data-status="${article.status}"
  >${({ pending: "審査待ち", published: "掲載中", rejected: "非掲載" })[article.status] || "不明"}</span>
</div>


<p id="draftNotice">${draft ? "保存済みの下書きを表示しています。公開版へは未反映です。" : "公開版の記事を表示しています。"}</p>
<div id="articleViewActions">
  <button type="button" id="applyDraftButton" ${draft ? "" : "hidden"}>下書きを反映</button>
  <button type="button" id="editArticleButton">
    記事を編集する
  </button>

  <div class="editor-draft-discard" ${draft ? "" : "hidden"}>
    <button type="button" id="discardDraftButton">下書きを破棄</button>
  </div>

  <div class="editor-publication">
    <p class="editor-section-label">掲載状態の変更</p>
    <div class="editor-actions">
      <button type="button" id="publishButton">掲載する</button>
      <button type="button" id="rejectButton">非掲載にする</button>
    </div>
  </div>
</div>


<form id="articleEditForm" hidden>
  <h2>記事を編集</h2>

  <label for="editTitle">タイトル</label>
  <textarea id="editTitle" name="title" maxlength="300" rows="2"></textarea>
  <label for="editSummary">概要</label>
  <textarea id="editSummary" name="summary" maxlength="3000" rows="4"></textarea>

  <label for="editBody">記事本文</label>
  <textarea id="editBody" name="article_body" maxlength="50000" rows="12"></textarea>

  <label for="editPoint">ここに注目♪</label>
  <textarea id="editPoint" name="ilovegame_point" maxlength="3000" rows="4"></textarea>

  <div class="editor-form-actions">
    <button type="button" id="cancelArticleEdit">キャンセル</button>
    <button type="button" id="regenerateArticle">AI再生成</button>
    <button type="submit">下書き保存</button>
  </div>
</form>

  </section>
  <a class="back" id="editorBackLink" href="/editor-dashboard.html">
    ← 編集室に戻る
  </a>

`;
        GameArticle.observeBody(app, { ...article, ...editable });

        const returnUrl = params.get("return");
        const backLink = document.getElementById("editorBackLink");

        const dashboardPath = "/editor-dashboard.html";

        if (
          returnUrl &&
          (returnUrl === dashboardPath ||
            returnUrl.startsWith(dashboardPath + "?"))
        ) {
          backLink.href = returnUrl;
        }

        const editButton = document.getElementById("editArticleButton");
        const editForm = document.getElementById("articleEditForm");
        let regenerated = draft?.regenerated === true;
        let busy = false;
        const fields = ["title", "summary", "article_body", "ilovegame_point"];
        const isDirty = () => fields.some(name => editForm.elements.namedItem(name).value !== (editable[name] || ""));
        function setBusy(value) {
          busy = value;
          editForm.querySelectorAll("button, textarea").forEach(control => control.disabled = value);
        }
        window.addEventListener("beforeunload", event => {
          if (!editForm.hidden && (busy || isDirty())) { event.preventDefault(); event.returnValue = ""; }
        });

        editButton.addEventListener("click", () => {
          editForm.elements.namedItem("title").value = editable.title || "";
          editForm.elements.namedItem("summary").value = editable.summary || "";
          editForm.elements.namedItem("article_body").value = editable.article_body || "";
          editForm.elements.namedItem("ilovegame_point").value = editable.ilovegame_point || "";

          
editForm.hidden = false;
document.getElementById("articleViewActions").hidden = true;

        });

        document.getElementById("cancelArticleEdit").addEventListener("click", () => {
          const changed = fields.some(name => {
            const field = editForm.elements.namedItem(name);
            const original = editable[name] || "";
            return field.value !== original;
          });

          if (changed && !confirm("編集をキャンセルしますか？保存していない変更は失われます。")) {
            return;
          }

          regenerated = draft?.regenerated === true;
          
editForm.hidden = true;
document.getElementById("articleViewActions").hidden = false;

        });

        document.getElementById("regenerateArticle").addEventListener("click", async event => {
          const button = event.currentTarget;

          if (!confirm("AIで記事を再生成しますか？現在の入力内容は置き換わります。")) return;

          if (busy) return;
          setBusy(true);
          button.textContent = "AI記事再生成中";

          try {
            const result = await GameEditorRegenerate.regenerate(Number(article.id));
            if (!result) return;

            for (const name of ["title", "summary", "article_body", "ilovegame_point"]) {
              editForm.elements.namedItem(name).value = result[name];
            }

            regenerated = true;
            alert("AIで記事を再生成しました。内容を確認して下書き保存してください。公開版へは未反映です。");
          } catch (error) {
            console.error("記事再生成エラー:", error);
            alert(`AI再生成に失敗しました。\n${error.message}`);
          } finally {
            setBusy(false);
            button.textContent = "AI再生成";
          }
        });

        editForm.addEventListener("submit", async event => {
          event.preventDefault();

          const data = {
            id: Number(article.id),
            regenerated,
            title: editForm.elements.namedItem("title").value,
            summary: editForm.elements.namedItem("summary").value,
            article_body: editForm.elements.namedItem("article_body").value,
            ilovegame_point: editForm.elements.namedItem("ilovegame_point").value
          };

          if (busy) return;
          setBusy(true);

          try {
            const success = await GameEditorSave.save(data);
            if (!success) return;

            alert("下書きを保存しました。公開版へは未反映です。");
            editForm.hidden = true;
            location.reload();
          } catch (error) {
            console.error("記事保存エラー:", error);
            alert("保存結果を確認できませんでした。記事を再確認してください。");
          } finally {
            setBusy(false);
          }
        });

        // 反映・破棄の通信中は操作をまとめて無効化し、競合する操作を防ぐ。
        let draftActionBusy = false;
        async function runDraftAction(action, message) {
          if (draftActionBusy || !confirm(message)) return;
          draftActionBusy = true;
          const controls = [...document.querySelectorAll("#articleViewActions button")];
          const disabledStates = controls.map(control => control.disabled);
          controls.forEach(control => control.disabled = true);
          try {
            if (!await GameEditorSave.save({ id: Number(article.id), action })) return;
            location.reload();
          } catch (error) {
            alert(error.message);
          } finally {
            draftActionBusy = false;
            controls.forEach((control, index) => control.disabled = disabledStates[index]);
          }
        }

        document.getElementById("applyDraftButton").addEventListener("click", () =>
          runDraftAction("apply", "下書きの内容を公開版へ反映しますか？掲載状態は変わりません。")
        );
        document.getElementById("discardDraftButton").addEventListener("click", () =>
          runDraftAction("discard", "下書きを破棄して、公開版の内容に戻しますか？この操作は取り消せません。公開版は変更されません。")
        );

        const publishButton = document.getElementById("publishButton");
        const rejectButton = document.getElementById("rejectButton");

        function updateButtons() {
          publishButton.disabled = article.status === "published";
          rejectButton.disabled = article.status === "rejected";
        }

        updateButtons();

        async function changeStatus(status) {
          const action = status === "published" ? "掲載" : "非掲載";

          if (!confirm(`この記事を${action}に変更しますか？`)) return;

          publishButton.disabled = true;
          rejectButton.disabled = true;

          try {
            const success = await GameEditorStatus.update(
              Number(article.id),
              status
            );

            if (!success) return;

            article.status = status;

            const statusLabel = {
              pending: "審査待ち",
              published: "掲載中",
              rejected: "非掲載"
            };

            const statusText = document.getElementById("articleStatus");
            
if (statusText) {
  statusText.textContent = statusLabel[status] || "不明";
  statusText.dataset.status = status;
}

            updateButtons();
          } catch (error) {
            console.error("掲載状態の変更エラー:", error);
            alert("変更に失敗しました。");
            updateButtons();
          }
        }

        publishButton.addEventListener("click", () => changeStatus("published"));
        rejectButton.addEventListener("click", () => changeStatus("rejected"));

      } catch (error) {
        app.innerHTML = `
          <div class="error">
            <h2>記事を表示できませんでした</h2>
            <p>${esc(error.message)}</p>
            <a href="/editor-dashboard.html">
              ← 編集室に戻る
            </a>
          </div>
        `;
      }
    }

    loadArticle();
  </script>
</body>
</html>
