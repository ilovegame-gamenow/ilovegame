
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ログイン | I LOVE GAME♪ 編集室</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: #fff8f1;
      color: #333;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      display: flex;
      flex-direction: column;
    }
    header {
      background: #ff8a3d;
      color: white;
      text-align: center;
      padding: 28px 16px;
    }
    h1 { margin: 0; font-size: 24px; }
    header p { margin: 8px 0 0; font-size: 14px; }
    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }
    .login-card {
      background: white;
      width: 100%;
      max-width: 420px;
      border-radius: 18px;
      padding: 32px;
      box-shadow: 0 4px 20px #0000000d;
    }
    h2 { margin: 0 0 22px; font-size: 21px; }
    label {
      display: block;
      font-size: 14px;
      margin-bottom: 10px;
    }
    input {
      display: block;
      width: 100%;
      padding: 13px;
      border: 1px solid #ddd;
      border-radius: 9px;
      font-size: 16px;
      margin-bottom: 18px;
    }
    button {
      width: 100%;
      background: #ff8a3d;
      color: white;
      border: 0;
      border-radius: 9px;
      padding: 13px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    button:disabled { opacity: .6; cursor: default; }
    #message {
      margin: 14px 0 0;
      font-size: 14px;
      color: #b45309;
      min-height: 20px;
    }
  </style>
</head>
<body>
  <header>
    <h1>🎮 I LOVE GAME♪ 編集室</h1>
    <p>ゲームの今をお届け♪</p>
  </header>

  <main>
    <section class="login-card">
      <h2>編集室にログイン</h2>
      <form id="loginForm">
        <label for="password">管理者パスワード</label>
        <input
          id="password"
          type="password"
          required
          autocomplete="current-password"
        >
        <button type="submit">ログイン</button>
        <p id="message" role="status" aria-live="polite"></p>
      </form>
    </section>
  </main>

  <script>
    const form = document.getElementById("loginForm");
    const message = document.getElementById("message");

    // ログイン済みなら編集室へ移動
    async function checkSession() {
      try {
        const response = await fetch("/api/editor-news", {
          credentials: "same-origin",
          cache: "no-store"
        });
        if (response.ok) {
          location.replace("/editor-dashboard.html");
        }
      } catch {
        // 通信エラー時はログイン画面を維持
      }
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const passwordInput = document.getElementById("password");
      const password = passwordInput.value;
      const button = form.querySelector('button[type="submit"]');

      button.disabled = true;
      message.textContent = "ログイン中...";

      try {
        const response = await fetch("/api/editor-login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "same-origin",
          body: JSON.stringify({ password })
        });

        if (!response.ok) {
          message.textContent = response.status === 401
            ? "パスワードが違います。"
            : "ログインできませんでした。";
          return;
        }

        passwordInput.value = "";
        location.replace("/editor-dashboard.html");
      } catch {
        message.textContent = "通信エラーが発生しました。";
      } finally {
        button.disabled = false;
      }
    });

    checkSession();
  </script>
</body>
</html>
