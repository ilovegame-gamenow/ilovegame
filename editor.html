<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>I LOVE GAME♪ 編集室</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #fff8f1;
      color: #333;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    }
    header {
      padding: 24px 20px;
      background: #ff8a3d;
      color: white;
      text-align: center;
    }
    header h1 { margin: 0; font-size: 24px; }
    header p { margin: 8px 0 0; font-size: 14px; }
    main { max-width: 900px; margin: 30px auto; padding: 0 16px; }
    .panel {
      background: white;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 3px 14px #0000000d;
    }
    h2 { margin-top: 0; font-size: 20px; }
    .notice {
      padding: 16px;
      background: #fff2e5;
      border-radius: 10px;
      line-height: 1.8;
    }
  </style>
</head>
<body>
  <header>
    <h1>I LOVE GAME♪ 編集室</h1>
    <p>ゲームの今をお届け♪</p>
  </header>
  <main>
    
<section class="panel">
  <h2>編集室にログイン 🔐</h2>
  <form id="loginForm">
    <label for="password">管理者パスワード</label>
    <input
      id="password"
      type="password"
      required
      autocomplete="current-password"
      style="display:block;width:100%;padding:12px;margin:12px 0;border:1px solid #ddd;border-radius:8px;font-size:16px;"
    >
    <button
      type="submit"
      style="background:#ff8a3d;color:white;border:0;border-radius:8px;padding:12px 24px;font-size:16px;cursor:pointer;"
    >ログイン</button>
    <p id="loginMessage" role="status" aria-live="polite"></p>
  </form>
</section>

<section class="panel" id="articlesPanel" hidden style="margin-top:20px;">
  <h2>記事一覧 📰</h2>
  <p id="articlesMessage" role="status" aria-live="polite"></p>
  <div id="articlesList"></div>
</section>

  </main>
<script>
  const loginForm = document.getElementById("loginForm");
  const loginMessage = document.getElementById("loginMessage");

  loginForm.addEventListener("submit", async (event) => {
    event.preventDefault();

    const passwordInput = document.getElementById("password");
    const password = passwordInput.value;
    const button = loginForm.querySelector('button[type="submit"]');

    button.disabled = true;
    loginMessage.textContent = "ログイン中...";

    try {
      const response = await fetch("/api/editor-login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        credentials: "same-origin",
        body: JSON.stringify({ password })
      });

      if (!response.ok) {
        loginMessage.textContent =
          response.status === 401
            ? "パスワードが違います。"
            : "ログインできませんでした。";
        return;
      }

      passwordInput.value = "";
      loginMessage.textContent = "ログイン成功！🎉";
      
articlesPanel.hidden = false;
await loadArticles();

    } catch {
      loginMessage.textContent = "通信エラーが発生しました。";
    } finally {
      button.disabled = false;
    }
  });
  
  const articlesPanel = document.getElementById("articlesPanel");
  const articlesMessage = document.getElementById("articlesMessage");
  const articlesList = document.getElementById("articlesList");

  async function loadArticles() {
    articlesMessage.textContent = "記事を読み込み中...";
    articlesList.replaceChildren();

    try {
      const response = await fetch("/api/editor-news", {
        credentials: "same-origin",
        cache: "no-store"
      });

      if (!response.ok) {
        articlesMessage.textContent =
          response.status === 401
            ? "ログインが必要です。"
            : "記事を取得できませんでした。";
        return;
      }

      const data = await response.json();
      const articles = data.articles || [];

      articlesMessage.textContent =
        `${articles.length}件の記事を表示しています。`;

      for (const article of articles) {
        const item = document.createElement("div");
        item.style.cssText =
          "padding:16px 0;border-bottom:1px solid #eee;";

        const title = document.createElement("strong");
        title.textContent = article.title || "タイトルなし";

        const info = document.createElement("p");
        info.style.cssText =
          "margin:8px 0 0;color:#666;font-size:14px;";

        const statusLabels = {
          published: "掲載中",
          pending: "審査待ち",
          rejected: "非掲載"
        };

        const status = statusLabels[article.status] || "不明";
        const score = article.importance ?? "未評価";

        info.textContent =
          `ID: ${article.id} ／ AI評価: ${score}点 ／ ${status}`;

        item.append(title, info);
        articlesList.appendChild(item);
      }
    } catch {
      articlesMessage.textContent = "通信エラーが発生しました。";
    }
  }

</script>

</body>
</html>
