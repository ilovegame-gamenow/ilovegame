<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>I LOVE GAME♪ 編集室</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #fff8f1;
      color: #333;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    }
    header {
      padding: 24px 20px;
      background: #ff8a3d;
      color: white;
      text-align: center;
    }
    header h1 { margin: 0; font-size: 24px; }
    header p { margin: 8px 0 0; font-size: 14px; }
    main { max-width: 900px; margin: 30px auto; padding: 0 16px; }
    .panel {
      background: white;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 3px 14px #0000000d;
    }
    h2 { margin-top: 0; font-size: 20px; }
    .notice {
      padding: 16px;
      background: #fff2e5;
      border-radius: 10px;
      line-height: 1.8;
    }
  </style>
</head>
<body>
  <header>
    <h1>I LOVE GAME♪ 編集室</h1>
    <p>ゲームの今をお届け♪</p>
  </header>
  <main>
    <section class="panel">
      <h2>記事管理</h2>
      <div class="notice">
        編集室の準備中です♪<br>
        記事一覧と公開・非公開の管理機能を追加していきます。
      </div>
    </section>
  </main>
</body>
</html>
