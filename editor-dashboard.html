<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>I LOVE GAME♪ 編集室</title>
  <link rel="stylesheet" href="/header.css">
  <link rel="stylesheet" href="/news-card.css">
  <link rel="stylesheet" href="/pagination.css">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #fff8f1;
      color: #333;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    }
    button:not(.pagination button) {
      cursor: pointer;
      font: inherit;
      border-radius: 9px;
      padding: 10px 14px;
    }
    button:disabled { cursor: default; opacity: .65; }
    .logout {
  background: #fff3e9;
  border: 1px solid #ff7a2f;
  color: #d65f18;
  font-weight: 700;
}
.editor-header-actions {
  display: flex;
  align-items: center;
  gap: 12px;
}
.editor-header-label {
  font-size: 18px;
  font-weight: 800;
  white-space: nowrap;
}
    main {
      max-width: 1100px;
      margin: 24px auto;
      padding: 0 16px;
    }
    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 22px;
    }
    .stat {
      background: white;
      border-radius: 14px;
      padding: 18px;
      border-top: 4px solid;
    }
    .stat.pending { border-color: #e99425; }
    .stat.published { border-color: #249a69; }
    .stat.rejected { border-color: #8c929b; }
    .stat-label { font-size: 13px; color: #666; }
    .stat-count {
      font-size: 28px;
      font-weight: bold;
      margin-top: 5px;
    }
     .panel {
      background: transparent;
      border-radius: 0;
      padding: 0;
    }
      
    .tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 20px;
    }
    .tab {
      background: #f5f5f5;
      border: 1px solid #ddd;
      color: #555;
    }
    .tab.active {
      background: #ff8a3d;
      border-color: #ff8a3d;
      color: white;
      font-weight: bold;
    }
    .article {
      padding: 18px 0;
      border-bottom: 1px solid #eee;
    }
    .article:last-child { border-bottom: 0; }
    .article-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
    }
    .article-title {
      font-size: 16px;
      font-weight: bold;
      line-height: 1.6;
    }
    .meta {
      font-size: 13px;
      color: #777;
      margin: 8px 0 14px;
    }
    .badge {
      display: inline-block;
      white-space: nowrap;
      padding: 5px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
    }
    .badge.pending {
      background: #fff0d8;
      color: #a76300;
    }
    .badge.published {
      background: #ddf5e9;
      color: #16784e;
    }
    .badge.rejected {
      background: #eceef0;
      color: #59616b;
    }
    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .edit-btn {
  border: 1px solid #e99425;
  background: #fff4e8;
  color: #b65c16;
}
    .publish-btn {
      border: 1px solid #249a69;
      background: white;
      color: #16784e;
    }
    .publish-btn.selected {
      background: #249a69;
      color: white;
    }
    .reject-btn {
      border: 1px solid #8c929b;
      background: white;
      color: #59616b;
    }
    .reject-btn.selected {
      background: #727b86;
      color: white;
    }
    .message { color: #666; font-size: 14px; }
    /* 編集室の記事カード一覧 */
#articlesList {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 12px;
}
    @media (max-width: 800px) {
  #articlesList {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}

@media (max-width: 600px) {
  #articlesList {
    grid-template-columns: 1fr;
  }
}

#articlesList .article {
  min-width: 0;
  padding: 0;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}
/* 記事カードを伸ばし、管理エリアを下に揃える */
#articlesList .card {
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
}
/* 編集室専用の管理エリア */
    #articlesList .article-management {
  margin-top: auto;
  padding: 8px 4px;
  border-top: 1px solid #eee2d8;
}
#articlesList .article-top {
  margin-top: 8px;
  padding: 0 4px;
  align-items: center;
}

#articlesList .actions {
  margin-bottom: 8px;
  padding: 6px 4px 0;
  gap: 6px;
}
#articlesList .actions button {
  flex: 1;
  min-width: 0;
  min-height: 40px;
  padding: 8px 4px;
  font-size: 13px;
  font-weight: 500;
  white-space: nowrap;
}
    @media (max-width: 600px) {
      h1 { font-size: 18px; }
      .stats { gap: 8px; }
      .stat { padding: 12px; }
      .stat-count { font-size: 23px; }
      .article-top { flex-direction: column; }
    }

    /* 記事プレビュー */
    #previewDialog {
      width: min(720px, calc(100% - 24px));
      max-height: 88vh;
      padding: 0;
      border: none;
      border-radius: 18px;
      box-shadow: 0 15px 60px #0003;
    }

    #previewDialog::backdrop {
      background: #0009;
    }

    .preview-content {
      padding: 24px;
      max-height: 88vh;
      overflow-y: auto;
    }

    #closePreview {
      display: block;
      margin-left: auto;
      margin-bottom: 16px;
      background: #f3f3f3;
      color: #333;
    }

    #previewTitle {
      font-size: 22px;
      line-height: 1.5;
      margin: 0 0 18px;
    }

    #previewBody {
      font-size: 15px;
      line-height: 1.8;
      overflow-wrap: anywhere;
    }

    #previewBody img {
      display: block;
      max-width: 100%;
      height: auto;
      border-radius: 12px;
      margin: 16px 0;
    }

    #previewBody a {
      color: #d66b20;
    }

    #previewBody .preview-point {
      background: #fff4e8;
      padding: 16px;
      border-radius: 12px;
      margin: 20px 0;
    }

#editorForm:not([hidden]) {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-top: 20px;
}

#editorForm label {
  font-size: 14px;
  color: var(--ink);
}

#editorForm input,
#editorForm textarea {
  box-sizing: border-box;
  width: 100%;
  padding: 12px;
  border: 1px solid #ddd;
  border-radius: 8px;
  font: inherit;
  line-height: 1.6;
  resize: vertical;
}

.editor-form-actions {
  display: flex;
  justify-content: flex-end;
  gap: 10px;
  margin-top: 12px;
}

.editor-form-actions button {
  min-width: 120px;
  min-height: 44px;
  font-size: 14px;
  font-weight: 500;
}

#regenerateArticle {
  background: #fff4e8;
  border: 1px solid #e99425;
  color: #b65c16;
}

.editor-form-actions button[type="submit"] {
  background: #ff8a3d;
  border: 1px solid #ff8a3d;
  color: white;
}
  </style>
</head>
<body data-page="editor">
  <header></header>
  <main>
    <div class="stats">
      <div class="stat pending">
        <div class="stat-label">審査待ち</div>
        <div class="stat-count" id="pendingCount">—</div>
      </div>
      <div class="stat published">
        <div class="stat-label">掲載中</div>
        <div class="stat-count" id="publishedCount">—</div>
      </div>
      <div class="stat rejected">
        <div class="stat-label">非掲載</div>
        <div class="stat-count" id="rejectedCount">—</div>
      </div>
    </div>

    <section class="panel" id="latest">
      <div class="tabs" id="tabs">
        <button class="tab active" data-filter="pending">審査待ち</button>
        <button class="tab" data-filter="published">掲載中</button>
        <button class="tab" data-filter="rejected">非掲載</button>
        <button class="tab" data-filter="all">すべて</button>
      </div>
<p class="message" id="message" role="status" aria-live="polite"></p>
<div id="paginationTop"></div>
<div id="articlesList"></div>
<div id="pagination"></div>
    </section>
  </main>
  <!-- 記事プレビュー -->
  <dialog id="previewDialog" aria-labelledby="previewTitle">
    <div class="preview-content">
      <button type="button" id="closePreview">× 閉じる</button>

      <h2 id="previewTitle">記事プレビュー</h2>
      <form id="editorForm" hidden>
  <label for="editTitle">タイトル</label>
  <input id="editTitle" name="title" type="text" maxlength="300" required>

  <label for="editSummary">概要</label>
  <textarea id="editSummary" name="summary" maxlength="3000" rows="4"></textarea>

  <label for="editBody">記事本文</label>
  <textarea id="editBody" name="article_body" maxlength="50000" rows="12"></textarea>

  <label for="editPoint">ここに注目♪</label>
  <textarea id="editPoint" name="ilovegame_point" maxlength="3000" rows="4"></textarea>
  <div class="editor-form-actions">
  <button type="button" id="regenerateArticle">AI再生成</button>
  <button type="submit">保存</button>
</div>
</form>
      <div id="previewBody">
        記事を読み込み中...
      </div>
    </div>
  </dialog>
  <script src="/image-utils.js"></script>
  <script src="/date-utils.js"></script>
  <script src="/news-card.js"></script>
  <script src="/pagination.js"></script>
  <script src="/news-list.js"></script>
  <script src="/header.js"></script>
  <script>
    const list = document.getElementById("articlesList");
    const message = document.getElementById("message");
    const tabs = document.getElementById("tabs");

const urlParams = new URLSearchParams(window.location.search);

const savedFilter = urlParams.get("status");
const validFilters = ["pending", "published", "rejected", "all"];

let articles = [];
let currentFilter = validFilters.includes(savedFilter)
  ? savedFilter
  : "pending";

const pagination = document.getElementById("pagination");

const savedPage = Number(urlParams.get("page"));
let currentPage = Number.isSafeInteger(savedPage) && savedPage > 0
  ? savedPage
  : 1;

let totalArticles = 0;
const pageSize = 20;
let articleCounts = { pending: 0, published: 0, rejected: 0 };
    const labels = {
      pending: "審査待ち",
      published: "掲載中",
      rejected: "非掲載"
    };

    async function loadArticles() {
      message.textContent = "記事を読み込み中...";

      try {
        const response = await fetch(`/api/editor-news?page=${currentPage}&status=${currentFilter}`, {
          credentials: "same-origin",
          cache: "no-store"
        });

        if (response.status === 401) {
          location.replace("/editor.html");
          return;
        }

        if (!response.ok) throw new Error("取得失敗");

        const data = await response.json();
        articles = data.articles || [];
        totalArticles = data.total ?? 0;
        articleCounts = data.counts || { pending: 0, published: 0, rejected: 0 };
        render();
      } catch {
        message.textContent = "記事を取得できませんでした。";
      }
    }
function renderPagination() {
  const paginationTop = document.getElementById("paginationTop");

  paginationTop.replaceChildren();
  pagination.replaceChildren();

  const totalPages = Math.ceil(totalArticles / pageSize);
  if (totalPages <= 1) return;

  const onPageChange = page => {
    GameNewsList.navigate(page);
  };

  paginationTop.appendChild(
    GamePagination.render(currentPage, totalPages, onPageChange)
  );

  pagination.appendChild(
    GamePagination.render(currentPage, totalPages, onPageChange)
  );
}

    function render() {
      list.replaceChildren();
      renderPagination();

      for (const status of ["pending", "published", "rejected"]) {
  document.getElementById(status + "Count").textContent = articleCounts[status] ?? "—";
}

      const filtered = articles.filter(a =>
        currentFilter === "all" || a.status === currentFilter
      );

      message.textContent = totalArticles
        ? `全${totalArticles}件中、${filtered.length}件を表示しています。`
        : "該当する記事はありません。";

      for (const article of filtered) {
        const item = document.createElement("div");
        item.className = "article";

        const card = document.createElement("div");
card.innerHTML = GameNewsCard.render(article, {
  clickable: false
});

const cardElement = card.querySelector(".card");

if (cardElement) {
  cardElement.style.cursor = "pointer";
  cardElement.setAttribute("role", "button");
  cardElement.setAttribute("tabindex", "0");

  cardElement.addEventListener("click", () => {
    openPreview(article.id);
  });

  cardElement.addEventListener("keydown", event => {
    if (event.key === "Enter" || event.key === " ") {
      event.preventDefault();
      openPreview(article.id);
    }
  });
}

item.appendChild(cardElement || card);

        const top = document.createElement("div");
        top.className = "article-top";

        const badge = document.createElement("span");
        badge.className = "badge " + article.status;
        badge.textContent = labels[article.status] || "不明";

        top.appendChild(badge);

        const meta = document.createElement("div");
meta.className = "meta";
meta.textContent = `AI評価：${article.importance ?? "未評価"}点`;

top.appendChild(meta);
const actions = document.createElement("div");
actions.className = "actions";
        const edit = document.createElement("button");
edit.className = "edit-btn";
edit.textContent = "編集";

        const publish = document.createElement("button");
        publish.className = "publish-btn";
        publish.textContent = "掲載";

        const reject = document.createElement("button");
        reject.className = "reject-btn";
        reject.textContent = "非掲載";

        if (article.status === "published") {
          publish.classList.add("selected");
          publish.disabled = true;
        }
        if (article.status === "rejected") {
          reject.classList.add("selected");
          reject.disabled = true;
        }
edit.addEventListener("click", () => {
  openPreview(article.id, true);
});
        publish.addEventListener("click", () =>
          updateStatus(article, "published", publish, reject)
        );
        reject.addEventListener("click", () =>
          updateStatus(article, "rejected", publish, reject)
        );

        actions.append(edit, publish, reject);

const management = document.createElement("div");
management.className = "article-management";
management.append(top, actions);
management.addEventListener("click", event => {
  event.stopPropagation();
});
(cardElement || card).appendChild(management);
list.appendChild(item);
      }
    }

    async function updateStatus(article, status, publish, reject) {
      const action = status === "published" ? "掲載" : "非掲載";
      if (!confirm(`この記事を${action}に変更しますか？`)) return;

      publish.disabled = true;
      reject.disabled = true;
      message.textContent = "変更を保存中...";

      try {
        const response = await fetch("/api/editor-update", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "same-origin",
          body: JSON.stringify({ id: article.id, status })
        });

        if (response.status === 401) {
          location.replace("/editor.html");
          return;
        }
        if (!response.ok) throw new Error("保存失敗");

        await loadArticles();
      } catch {
        message.textContent = "変更に失敗しました。";
        render();
      }
    }
for (const tab of tabs.querySelectorAll(".tab")) {
  tab.classList.toggle(
    "active",
    tab.dataset.filter === currentFilter
  );
}
    tabs.addEventListener("click", event => {
      const button = event.target.closest("[data-filter]");
      if (!button) return;

      currentFilter = button.dataset.filter;

const url = new URL(window.location.href);
url.searchParams.set("status", currentFilter);
url.searchParams.set("page", "1");
window.history.replaceState(null, "", url);
      for (const tab of tabs.querySelectorAll(".tab")) {
        tab.classList.toggle("active", tab === button);
      }
      currentPage = 1;
      loadArticles();
    });

    document.addEventListener("click", async (event) => {
  if (!event.target.closest("#logoutButton")) return;

  message.textContent = "ログアウト中...";

  try {
    const response = await fetch("/api/editor-logout", {
      method: "POST",
      credentials: "same-origin"
    });

    if (!response.ok) throw new Error("ログアウト失敗");

    location.replace("/editor.html");
  } catch {
    message.textContent = "ログアウトできませんでした。";
  }
});
      const previewDialog = document.getElementById("previewDialog");
      const previewTitle = document.getElementById("previewTitle");
      const previewBody = document.getElementById("previewBody");
      const editorForm = document.getElementById("editorForm");
      const regenerateButton = document.getElementById("regenerateArticle");

      document.getElementById("closePreview")
        .addEventListener("click", () => previewDialog.close());

      previewDialog.addEventListener("click", (event) => {
        if (event.target === previewDialog) previewDialog.close();
      });
      editorForm.addEventListener("submit", async (event) => {
  event.preventDefault();

  const button = editorForm.querySelector('button[type="submit"]');
  const id = Number(editorForm.dataset.articleId);

  if (!Number.isSafeInteger(id) || id <= 0) {
    alert("記事IDを確認できませんでした。");
    return;
  }

  const data = {
    id,
    title: editorForm.elements.namedItem("title").value,
    summary: editorForm.elements.namedItem("summary").value,
    article_body: editorForm.elements.namedItem("article_body").value,
    ilovegame_point: editorForm.elements.namedItem("ilovegame_point").value
  };

  button.disabled = true;

  try {
    const response = await fetch("/api/editor-save", {
      method: "POST",
      credentials: "same-origin",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(data)
    });

    if (response.status === 401) {
      location.replace("/editor.html");
      return;
    }

    if (!response.ok) {
      throw new Error("保存失敗");
    }

    alert("記事を保存しました！");
    previewDialog.close();
    await loadArticles();
  } catch (error) {
    console.error("記事保存エラー:", error);
    alert("保存結果を確認できませんでした。記事を再確認してください。");
  } finally {
    button.disabled = false;
  }
});
      regenerateButton.addEventListener("click", async () => {
  const id = Number(editorForm.dataset.articleId);

  if (!Number.isSafeInteger(id) || id <= 0) {
    alert("記事IDを確認できませんでした。");
    return;
  }

  if (!confirm("AIで記事を再生成しますか？現在の入力内容は置き換わります。")) {
    return;
  }

  regenerateButton.disabled = true;
  regenerateButton.textContent = "AI記事再生成中";

  try {
    const response = await fetch("/api/editor-save", {
      method: "POST",
      credentials: "same-origin",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ action: "regenerate", id })
    });

    if (response.status === 401) {
      location.replace("/editor.html");
      return;
    }

    if (!response.ok) {
      throw new Error(`再生成失敗: ${response.status}`);
    }

    const data = await response.json();
    const article = data.article;

    for (const field of [
      "title",
      "summary",
      "article_body",
      "ilovegame_point"
    ]) {
      if (typeof article?.[field] !== "string") {
        throw new Error(`生成結果が不正です: ${field}`);
      }
    }

    editorForm.elements.namedItem("title").value = article.title;
    editorForm.elements.namedItem("summary").value = article.summary;
    editorForm.elements.namedItem("article_body").value = article.article_body;
    editorForm.elements.namedItem("ilovegame_point").value = article.ilovegame_point;

    alert("AIで記事を再生成しました。内容を確認してから保存してください。");
  } catch (error) {
    console.error("記事再生成エラー:", error);
    alert("AI再生成に失敗しました。元の記事は変更されていません。");
  } finally {
    regenerateButton.disabled = false;
    regenerateButton.textContent = "AI再生成";
  }
});
      async function openPreview(id, editMode = false) {
        editorForm.hidden = true;
        previewBody.hidden = false;
        editorForm.reset();
        
        previewTitle.textContent = "記事プレビュー";
        previewBody.textContent = "記事を読み込み中...";
        previewDialog.showModal();

        try {
          const response = await fetch(
            `/api/editor-detail?id=${encodeURIComponent(id)}`,
            {
              credentials: "same-origin",
              cache: "no-store"
            }
          );

          if (response.status === 401) {
            location.replace("/editor.html");
            return;
          }

          if (!response.ok) throw new Error("取得失敗");

          const data = await response.json();
          const article = data.article;
          editorForm.dataset.articleId = article.id;
          editorForm.elements.namedItem("title").value = article.title || "";
          editorForm.elements.namedItem("summary").value = article.summary || "";
          editorForm.elements.namedItem("article_body").value = article.article_body || "";
          editorForm.elements.namedItem("ilovegame_point").value = article.ilovegame_point || "";
          editorForm.hidden = !editMode;
          previewBody.hidden = editMode;
          previewTitle.textContent = editMode ? "記事を編集" : article.title || "タイトルなし";
          previewBody.replaceChildren();

          function addText(label, value) {
            if (!value) return;
            const section = document.createElement("p");
            const strong = document.createElement("strong");
            strong.textContent = label + "：";
            section.append(strong, document.createTextNode(String(value)));
            previewBody.appendChild(section);
          }

          
const imageUrl = GameImage.getUrl(
  article.thumbnail_url,
  article.source_name
);

if (imageUrl) {
  const img = document.createElement("img");
  img.src = imageUrl;
  img.alt = article.title || "記事画像";
  img.loading = "lazy";
  previewBody.appendChild(img);
}


          addText("掲載状態", {
            pending: "審査待ち",
            published: "掲載中",
            rejected: "非掲載"
          }[article.status] || "不明");

          addText("AI評価", article.importance == null
            ? "未評価"
            : `${article.importance}点`);

          addText("概要", article.summary);

          const body = document.createElement("div");
          body.style.whiteSpace = "pre-wrap";
          body.textContent = article.article_body || "記事本文はまだありません。";
          previewBody.appendChild(body);

          if (article.ilovegame_point) {
            const point = document.createElement("div");
            point.className = "preview-point";
            const heading = document.createElement("strong");
            heading.textContent = "ここに注目♪";
            const description = document.createElement("p");
            description.textContent = article.ilovegame_point;
            point.append(heading, description);
            previewBody.appendChild(point);
          }

          if (article.source_url) {
            const link = document.createElement("a");
            link.href = article.source_url;
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.textContent = "元記事を開く ↗";
            previewBody.appendChild(link);
          }
        } catch {
          previewBody.textContent = "記事を取得できませんでした。";
        }
      }


    loadArticles();
  </script>
