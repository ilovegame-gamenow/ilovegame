<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>I LOVE GAME♪ 編集室</title>
  <link rel="stylesheet" href="/header.css">
  <link rel="stylesheet" href="/news-card.css">
  <link rel="stylesheet" href="/pagination.css">
  <link rel="stylesheet" href="/editor-filters.css">
  <link rel="stylesheet" href="/editor-recovery.css">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #fff8f1;
      color: #333;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    }
    button:not(.pagination button) {
      cursor: pointer;
      font: inherit;
      border-radius: 9px;
      padding: 10px 14px;
    }
    button:disabled { cursor: default; opacity: .65; }
    .logout {
  background: #fff3e9;
  border: 1px solid #ff7a2f;
  color: #d65f18;
  font-weight: 700;
}
.editor-header-actions {
  display: flex;
  align-items: center;
  gap: 12px;
}
.editor-header-label {
  font-size: 18px;
  font-weight: 800;
  white-space: nowrap;
}
    main {
      max-width: 1100px;
      margin: 24px auto;
      padding: 0 16px;
    }
     .panel {
      background: transparent;
      border-radius: 0;
      padding: 0;
    }
      
    .article {
      padding: 18px 0;
      border-bottom: 1px solid #eee;
    }
    .article:last-child { border-bottom: 0; }
    .article-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
    }
    .article-title {
      font-size: 16px;
      font-weight: bold;
      line-height: 1.6;
    }
    .meta {
      font-size: 13px;
      color: #777;
      margin: 8px 0 14px;
    }
    .badge {
      display: inline-block;
      white-space: nowrap;
      padding: 5px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
    }
    .badge.pending {
      background: #fff0d8;
      color: #a76300;
    }
    .badge.published {
      background: #ddf5e9;
      color: #16784e;
    }
    .badge.rejected {
      background: #eceef0;
      color: #59616b;
    }
    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .edit-btn {
  border: 1px solid #e99425;
  background: #fff4e8;
  color: #b65c16;
}
    .publish-btn {
      border: 1px solid #249a69;
      background: white;
      color: #16784e;
    }
    .publish-btn.selected {
      background: #249a69;
      color: white;
    }
    .reject-btn {
      border: 1px solid #8c929b;
      background: white;
      color: #59616b;
    }
    .reject-btn.selected {
      background: #727b86;
      color: white;
    }
    .message { color: #666; font-size: 14px; }
    /* 編集室の記事カード一覧 */
#articlesList {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 12px;
}
    @media (max-width: 800px) {
  #articlesList {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}

@media (max-width: 600px) {
  #articlesList {
    grid-template-columns: 1fr;
  }
}

#articlesList .article {
  min-width: 0;
  padding: 0;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}
/* 記事カードを伸ばし、管理エリアを下に揃える */
#articlesList .card {
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
}
/* 編集室専用の管理エリア */
    #articlesList .article-management {
  margin-top: auto;
  padding: 8px 4px;
  border-top: 1px solid #eee2d8;
}
#articlesList .article-top {
  margin-top: 8px;
  padding: 0 4px;
  align-items: center;
}

#articlesList .actions {
  margin-bottom: 8px;
  padding: 6px 4px 0;
  gap: 6px;
}
#articlesList .actions button {
  flex: 1;
  min-width: 0;
  min-height: 40px;
  padding: 8px 4px;
  font-size: 13px;
  font-weight: 500;
  white-space: nowrap;
}
    @media (max-width: 600px) {
      h1 { font-size: 18px; }
      .article-top { flex-direction: column; }
    }
    
  </style>
</head>
<body data-page="editor">
  <header></header>
  <main>
    
<div class="dashboard-toolbar">
  <h1>記事管理</h1>
  <a class="dashboard-settings" href="/editor-games.html">作品管理</a>
  <a class="dashboard-settings" href="/editor-discoveries.html">発見候補</a>
  <a class="dashboard-settings" href="/editor-settings.html"><span aria-hidden="true">⚙︎</span> 設定・情報源</a>
</div>
<section id="pendingRecovery" class="editor-recovery-notice" hidden aria-label="中断した記事編集"></section>
<section class="editor-filters-panel" aria-label="記事の絞り込み">
  <div class="editor-filter-group">
    <h2 id="statusFilterHeading" class="filter-heading">掲載状態</h2>
    <p id="statusCountNote" class="filter-note">全メーカーの掲載状態別件数</p>
<div class="stats" role="group" aria-labelledby="statusFilterHeading" aria-describedby="statusCountNote">
  <button type="button" class="stat all" data-filter="all">
    <span class="stat-label">すべて</span>
    <span class="stat-count" id="allCount">—</span>
  </button>
  <button type="button" class="stat pending" data-filter="pending">
    <span class="stat-label">審査待ち</span>
    <span class="stat-count" id="pendingCount">—</span>
  </button>
  <button type="button" class="stat published" data-filter="published">
    <span class="stat-label">掲載中</span>
    <span class="stat-count" id="publishedCount">—</span>
  </button>
  <button type="button" class="stat rejected" data-filter="rejected">
    <span class="stat-label">非掲載</span>
    <span class="stat-count" id="rejectedCount">—</span>
  </button>
</div>
  </div>
  <div class="editor-filter-group">
    <h2 id="sourceFilterHeading" class="filter-heading">メーカー</h2>
    <p id="sourceCountNote" class="filter-note">メーカー別の件数を読み込み中…</p>
  <div id="sourceFilters" class="source-filters" role="group" aria-labelledby="sourceFilterHeading" aria-describedby="sourceCountNote">
    <button type="button" class="source-filter active" data-source="all" aria-pressed="true">すべて</button>
  </div>
  </div>
</section>
<section class="panel" id="latest">
<p class="message" id="message" role="status" aria-live="polite"></p>
<button id="retryArticles" class="retry-articles" type="button" hidden>もう一度読み込む</button>
<div id="paginationTop"></div>
<div id="articlesList"></div>
<div id="pagination"></div>
    </section>
  </main>
  <script src="/image-utils.js"></script>   
  <script src="/date-utils.js"></script>
  <script src="/news-card.js"></script>
  <script src="/pagination.js"></script>
  <script src="/news-list.js"></script>
  <script src="/editor-navigation.js"></script>
  <script src="/header.js"></script>
  <script src="/editor-status.js"></script>
  <script src="/editor-session.js"></script>
  <script src="/editor-news-loader.js"></script>
  <script src="/editor-recovery.js"></script>
  <script>
    
GameEditorSession.start();
 
    const list = document.getElementById("articlesList");
    const message = document.getElementById("message");
    const retryArticles = document.getElementById("retryArticles");
    retryArticles.addEventListener("click", () => loadArticles());

const urlParams = new URLSearchParams(window.location.search);

const savedFilter = urlParams.get("status");
const validFilters = ["pending", "published", "rejected", "all"];

let articles = [];
let currentFilter = validFilters.includes(savedFilter)
  ? savedFilter
  : "all";

const pagination = document.getElementById("pagination");

const savedPage = Number(urlParams.get("page"));
let currentPage = Number.isSafeInteger(savedPage) && savedPage > 0
  ? savedPage
  : 1;

let totalArticles = 0;
let pageSize = 20;
let articleCounts = { pending: 0, published: 0, rejected: 0 };
let currentSource = urlParams.get("source") || "all";
let sourceOptions = [];
let loadVersion = 0;
let listRequest = null;
    const labels = {
      pending: "審査待ち",
      published: "掲載中",
      rejected: "非掲載"
    };

    const listFreshness = GameEditorNavigation.createListState();
    async function loadArticles() {
      const snapshot = listFreshness.capture();
      const version = ++loadVersion;
      listRequest?.abort();
      listRequest = new AbortController();
      list.setAttribute("aria-busy", "true");
      message.textContent = "記事を読み込み中...";
      retryArticles.hidden = true;

      try {
        const data = await GameEditorNewsLoader.load({
          page:currentPage, status:currentFilter, source:currentSource, signal:listRequest.signal,
          onRetry:()=>{ if(version===loadVersion) message.textContent="記事を読み込み直しています…"; }
        });
        if (version !== loadVersion) return;
        currentSource = data.filters.source;
        sourceOptions = data.sources;
        pageSize = data.limit;
        if (currentPage !== data.page) {
          currentPage = data.page;
          const url = new URL(location.href);
          url.searchParams.set("page", String(currentPage));
          history.replaceState(null, "", url);
        }
        articles = data.articles || [];
        totalArticles = data.total ?? 0;
        articleCounts = data.counts || { pending: 0, published: 0, rejected: 0 };
        render();
        listFreshness.loaded(snapshot);
        GameEditorRecovery.renderPending(document.getElementById("pendingRecovery"));
        
let savedScrollY = null;
try { savedScrollY = sessionStorage.getItem("editorScrollY"); } catch {}

if (savedScrollY !== null) {
  try { sessionStorage.removeItem("editorScrollY"); } catch {}

  const scrollY = Number(savedScrollY);
  if (Number.isFinite(scrollY) && scrollY >= 0) {
    requestAnimationFrame(() => {
      window.scrollTo(0, scrollY);
    });
  }
}

      } catch (error) {
        if (error.name === "AbortError" || version !== loadVersion) return;
        if (error.status === 401) { GameEditorSession.expire(); return; }
        console.error("Editor list loading failed:", { message:error.message, status:error.status || null });
        message.textContent = "記事を読み込めませんでした。下のボタンからもう一度読み込めます。";
        retryArticles.hidden = false;
      } finally {
        if (version === loadVersion) list.setAttribute("aria-busy", "false");
      }
    }
function renderPagination() {
  const paginationTop = document.getElementById("paginationTop");

  paginationTop.replaceChildren();
  pagination.replaceChildren();

  const totalPages = Math.ceil(totalArticles / pageSize);
  if (totalPages <= 1) return;

  const onPageChange = page => {
    GameNewsList.navigate(page);
  };

  paginationTop.appendChild(
    GamePagination.render(currentPage, totalPages, onPageChange)
  );

  pagination.appendChild(
    GamePagination.render(currentPage, totalPages, onPageChange)
  );
}

    function articleSourceLink(article) {
      const known = sourceOptions.find(option=>option.id !== "all" && option.id !== "other" && option.label === article.source_name);
      const option = known || sourceOptions.find(option=>option.id === "other");
      if (!option || !article.source_name) return null;
      const url = new URL(location.href);
      url.searchParams.set("source", option.id);
      url.searchParams.set("status", currentFilter);
      url.searchParams.set("page", "1");
      url.hash = "latest";
      return { id:option.id, href:url.pathname+url.search+url.hash };
    }

    function render() {
      list.replaceChildren();
      renderPagination();
      renderSources();
      for (const status of ["all", "pending", "published", "rejected"]) {
  document.getElementById(status + "Count").textContent = articleCounts[status] ?? "—";
}

      const filtered = articles.filter(a =>
        currentFilter === "all" || a.status === currentFilter
      );

      const sourceLabel = sourceOptions.find(option => option.id === currentSource)?.label || "すべて";
      const statusLabel = labels[currentFilter] || "すべての掲載状態";
      const condition = `${currentSource === "all" ? "全メーカー" : sourceLabel} ／ ${statusLabel}`;
      message.textContent = totalArticles
        ? `${condition}：全${totalArticles}件中、${filtered.length}件を表示しています。`
        : `${condition}：該当する記事はありません。`;

      for (const article of filtered) {
        const item = document.createElement("div");
        item.className = "article";

        const card = document.createElement("div");
card.innerHTML = GameNewsCard.render(article, {
  clickable: false,
  sourceLink: articleSourceLink(article)
});

const cardElement = card.querySelector(".card");

if (cardElement) {
  cardElement.style.cursor = "pointer";
  cardElement.setAttribute("role", "button");
  cardElement.setAttribute("tabindex", "0");

cardElement.addEventListener("click", event => {
  if (event.target.closest("a, button, input, textarea, select")) return;
  GameEditorNavigation.openArticle(article.id);
});
  
cardElement.addEventListener("keydown", event => {
  if (event.target.closest("a, button, input, textarea, select")) return;
  if (event.key === "Enter" || event.key === " ") {
    event.preventDefault();
    cardElement.click();
  }
});

}

item.appendChild(cardElement || card);

        const top = document.createElement("div");
        top.className = "article-top";

        const badge = document.createElement("span");
        badge.className = "badge " + article.status;
        badge.textContent = labels[article.status] || "不明";

        top.appendChild(badge);

        const meta = document.createElement("div");
meta.className = "meta";

meta.textContent = article.processing_status !== "completed"
  ? "AI未評価"
  : `AI評価：${article.importance ?? 0}点`;

top.appendChild(meta);
const actions = document.createElement("div");
actions.className = "actions";
        const edit = document.createElement("button");
edit.className = "edit-btn";
edit.textContent = "編集";

        const publish = document.createElement("button");
        publish.className = "publish-btn";
        publish.textContent = "掲載";

        const reject = document.createElement("button");
        reject.className = "reject-btn";
        reject.textContent = "非掲載";

        if (article.status === "published") {
          publish.classList.add("selected");
          publish.disabled = true;
        }
        if (article.status === "rejected") {
          reject.classList.add("selected");
          reject.disabled = true;
        }

edit.addEventListener("click", () => {
  GameEditorNavigation.openArticle(article.id);
});

        publish.addEventListener("click", () =>
          updateStatus(article, "published", publish, reject)
        );
        reject.addEventListener("click", () =>
          updateStatus(article, "rejected", publish, reject)
        );

        actions.append(edit, publish, reject);

const management = document.createElement("div");
management.className = "article-management";
management.append(top, actions);
management.addEventListener("click", event => {
  event.stopPropagation();
});
(cardElement || card).appendChild(management);
list.appendChild(item);
      }
    }

 
async function updateStatus(article, status, publish, reject) {
  const action = status === "published" ? "掲載" : "非掲載";
  if (!confirm(`この記事を${action}に変更しますか？`)) return;

  publish.disabled = true;
  reject.disabled = true;
  message.textContent = "変更を保存中...";

  try {
    const success = await GameEditorStatus.update(
      Number(article.id),
      status
    );

    if (!success) return;

    await loadArticles();
  } catch (error) {
    console.error("掲載状態の変更エラー:", error);
    message.textContent = "変更に失敗しました。";
    render();
  }
}


function updateFilterButtons() {
  document.querySelectorAll("[data-filter]").forEach(button => {
    const active = button.dataset.filter === currentFilter;
    button.classList.toggle("active", active);
    button.setAttribute("aria-pressed", String(active));
  });
}

function renderSources() {
  const container = document.getElementById("sourceFilters");
  const focusedSource = document.activeElement?.dataset.source;
  container.replaceChildren();
  for (const option of sourceOptions) {
    const button = document.createElement("button");
    button.type = "button";
    button.className = "source-filter";
    button.dataset.source = option.id;
    button.textContent = `${option.label}（${option.count}件）`;
    const active = option.id === currentSource;
    button.classList.toggle("active", active);
    button.setAttribute("aria-pressed", String(active));
    container.append(button);
    if (focusedSource === option.id) button.focus({ preventScroll:true });
  }
  const statusLabel = labels[currentFilter] || "すべての掲載状態";
  document.getElementById("sourceCountNote").textContent = `${statusLabel}のメーカー別件数`;
  const sourceLabel = sourceOptions.find(option=>option.id===currentSource)?.label;
  document.getElementById("statusCountNote").textContent = `${currentSource === "all" ? "全メーカー" : sourceLabel}の掲載状態別件数`;
}

function changeConditions({ status = currentFilter, source = currentSource }) {
  if (!validFilters.includes(status)) return;
  if (source !== "all" && !sourceOptions.some(option=>option.id===source)) return;
  currentFilter = status;
  currentSource = source;
  currentPage = 1;
  sessionStorage.removeItem("editorScrollY");
  const url = new URL(location.href);
  url.searchParams.set("status", currentFilter);
  if (currentSource === "all") url.searchParams.delete("source");
  else url.searchParams.set("source", currentSource);
  url.searchParams.set("page", "1");
  history.replaceState(null, "", url);
  updateFilterButtons();
  document.querySelectorAll("#sourceFilters [data-source]").forEach(button=>{
    const active = button.dataset.source === currentSource;
    button.classList.toggle("active", active);
    button.setAttribute("aria-pressed", String(active));
  });
  loadArticles();
}

document.addEventListener("click", event => {
  const sourceButton = event.target.closest("[data-source]");
  if (sourceButton) {
    event.preventDefault();
    changeConditions({ source:sourceButton.dataset.source });
    if (sourceButton.classList.contains("game-source-link")) {
      const control = [...document.querySelectorAll("#sourceFilters [data-source]")].find(button=>button.dataset.source === sourceButton.dataset.source);
      control?.focus({ preventScroll:true });
      document.querySelector(".editor-filters-panel")?.scrollIntoView({ block:"start", behavior:"smooth" });
    }
    return;
  }
  const statusButton = event.target.closest("[data-filter]");
  if (statusButton) changeConditions({ status:statusButton.dataset.filter });
});

updateFilterButtons();


    document.addEventListener("click", async (event) => {
  if (!event.target.closest("#logoutButton")) return;

  message.textContent = "ログアウト中...";

  try {
    const response = await fetch("/api/editor-logout", {
      method: "POST",
      credentials: "same-origin"
    });

    if (!response.ok) throw new Error("ログアウト失敗");

    location.replace("/editor.html");
  } catch {
    message.textContent = "ログアウトできませんでした。";
  }
});
    
    window.addEventListener("pageshow", event => {
      if (!event.persisted) return;
      GameEditorRecovery.renderPending(document.getElementById("pendingRecovery"));
      if (listFreshness.needsReload()) {
        loadArticles();
      } else {
        // Safariが保持したDOMとスクロール位置をそのまま利用する。
        try { sessionStorage.removeItem("editorScrollY"); } catch {}
      }
    });
    loadArticles();
  </script>
</body>
</html>
