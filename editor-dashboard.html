<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>I LOVE GAME♪ 編集室</title>
  <link rel="stylesheet" href="/header.css">
  <link rel="stylesheet" href="/news-card.css">
  <link rel="stylesheet" href="/pagination.css">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #fff8f1;
      color: #333;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    }
    button:not(.pagination button) {
      cursor: pointer;
      font: inherit;
      border-radius: 9px;
      padding: 10px 14px;
    }
    button:disabled { cursor: default; opacity: .65; }
    .logout {
  background: #fff3e9;
  border: 1px solid #ff7a2f;
  color: #d65f18;
  font-weight: 700;
}
.editor-header-actions {
  display: flex;
  align-items: center;
  gap: 12px;
}
.editor-header-label {
  font-size: 18px;
  font-weight: 800;
  white-space: nowrap;
}
    main {
      max-width: 1100px;
      margin: 24px auto;
      padding: 0 16px;
    }
    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 22px;
    }
    .stat {
      background: white;
      border-radius: 14px;
      padding: 18px;
      border-top: 4px solid;
    }
    .stat.pending { border-color: #e99425; }
    .stat.published { border-color: #249a69; }
    .stat.rejected { border-color: #8c929b; }
    .stat-label { font-size: 13px; color: #666; }
    .stat-count {
      font-size: 28px;
      font-weight: bold;
      margin-top: 5px;
    }
    
.stat {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  text-align: left;
  width: 100%;
  color: inherit;
  border-left: 1px solid #eee2d8;
  border-right: 1px solid #eee2d8;
  border-bottom: 1px solid #eee2d8;
}


.stat.pending.active {
  background: #fff0d8;
}

.stat.published.active {
  background: #ddf5e9;
}

.stat.rejected.active {
  background: #eceef0;
}


.stat:focus-visible {
  outline: 3px solid #ff8a3d;
  outline-offset: 3px;
}

     .panel {
      background: transparent;
      border-radius: 0;
      padding: 0;
    }
      
    .tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 20px;
    }
    .tab {
      background: #f5f5f5;
      border: 1px solid #ddd;
      color: #555;
    }
    .tab.active {
      background: #ff8a3d;
      border-color: #ff8a3d;
      color: white;
      font-weight: bold;
    }
    .article {
      padding: 18px 0;
      border-bottom: 1px solid #eee;
    }
    .article:last-child { border-bottom: 0; }
    .article-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
    }
    .article-title {
      font-size: 16px;
      font-weight: bold;
      line-height: 1.6;
    }
    .meta {
      font-size: 13px;
      color: #777;
      margin: 8px 0 14px;
    }
    .badge {
      display: inline-block;
      white-space: nowrap;
      padding: 5px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
    }
    .badge.pending {
      background: #fff0d8;
      color: #a76300;
    }
    .badge.published {
      background: #ddf5e9;
      color: #16784e;
    }
    .badge.rejected {
      background: #eceef0;
      color: #59616b;
    }
    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .edit-btn {
  border: 1px solid #e99425;
  background: #fff4e8;
  color: #b65c16;
}
    .publish-btn {
      border: 1px solid #249a69;
      background: white;
      color: #16784e;
    }
    .publish-btn.selected {
      background: #249a69;
      color: white;
    }
    .reject-btn {
      border: 1px solid #8c929b;
      background: white;
      color: #59616b;
    }
    .reject-btn.selected {
      background: #727b86;
      color: white;
    }
    .message { color: #666; font-size: 14px; }
    /* 編集室の記事カード一覧 */
#articlesList {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 12px;
}
    @media (max-width: 800px) {
  #articlesList {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}

@media (max-width: 600px) {
  #articlesList {
    grid-template-columns: 1fr;
  }
}

#articlesList .article {
  min-width: 0;
  padding: 0;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}
/* 記事カードを伸ばし、管理エリアを下に揃える */
#articlesList .card {
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
}
/* 編集室専用の管理エリア */
    #articlesList .article-management {
  margin-top: auto;
  padding: 8px 4px;
  border-top: 1px solid #eee2d8;
}
#articlesList .article-top {
  margin-top: 8px;
  padding: 0 4px;
  align-items: center;
}

#articlesList .actions {
  margin-bottom: 8px;
  padding: 6px 4px 0;
  gap: 6px;
}
#articlesList .actions button {
  flex: 1;
  min-width: 0;
  min-height: 40px;
  padding: 8px 4px;
  font-size: 13px;
  font-weight: 500;
  white-space: nowrap;
}
    @media (max-width: 600px) {
      h1 { font-size: 18px; }
      .stats { gap: 8px; }
      .stat { padding: 12px; }
      .stat-count { font-size: 23px; }
      .article-top { flex-direction: column; }
    }
    
  </style>
</head>
<body data-page="editor">
  <header></header>
  <main>
    
<div class="stats">
  <button type="button" class="stat pending" data-filter="pending">
    <span class="stat-label">審査待ち</span>
    <span class="stat-count" id="pendingCount">—</span>
  </button>
  <button type="button" class="stat published" data-filter="published">
    <span class="stat-label">掲載中</span>
    <span class="stat-count" id="publishedCount">—</span>
  </button>
  <button type="button" class="stat rejected" data-filter="rejected">
    <span class="stat-label">非掲載</span>
    <span class="stat-count" id="rejectedCount">—</span>
  </button>
</div>

    <section class="panel" id="latest">
      
<div class="tabs" id="tabs">
  <button type="button" class="tab" data-filter="all">すべて</button>
</div>
script>
  <script src="/date-utils.js"></script>
<p class="message" id="message" role="status" aria-live="polite"></p>
<div id="paginationTop"></div>
<div id="articlesList"></div>
<div id="pagination"></div>
    </section>
  </main>
  <script src="/image-utils.js"></
  <script src="/news-card.js"></script>
  <script src="/pagination.js"></script>
  <script src="/news-list.js"></script>
  <script src="/header.js"></script>
  <script src="/editor-status.js"></script>
  <script src="/editor-session.js"></script>
  <script>
    
GameEditorSession.start();
 
    const list = document.getElementById("articlesList");
    const message = document.getElementById("message");
    const tabs = document.getElementById("tabs");

const urlParams = new URLSearchParams(window.location.search);

const savedFilter = urlParams.get("status");
const validFilters = ["pending", "published", "rejected", "all"];

let articles = [];
let currentFilter = validFilters.includes(savedFilter)
  ? savedFilter
  : "pending";

const pagination = document.getElementById("pagination");

const savedPage = Number(urlParams.get("page"));
let currentPage = Number.isSafeInteger(savedPage) && savedPage > 0
  ? savedPage
  : 1;

let totalArticles = 0;
const pageSize = 20;
let articleCounts = { pending: 0, published: 0, rejected: 0 };
    const labels = {
      pending: "審査待ち",
      published: "掲載中",
      rejected: "非掲載"
    };

    async function loadArticles() {
      message.textContent = "記事を読み込み中...";

      try {
        const response = await fetch(`/api/editor-news?page=${currentPage}&status=${currentFilter}`, {
          credentials: "same-origin",
          cache: "no-store"
        });

        if (response.status === 401) {
          location.replace("/editor.html");
          return;
        }

        if (!response.ok) throw new Error("取得失敗");

        const data = await response.json();
        articles = data.articles || [];
        totalArticles = data.total ?? 0;
        articleCounts = data.counts || { pending: 0, published: 0, rejected: 0 };
        render();
        
const savedScrollY = sessionStorage.getItem("editorScrollY");

if (savedScrollY !== null) {
  sessionStorage.removeItem("editorScrollY");

  const scrollY = Number(savedScrollY);
  if (Number.isFinite(scrollY) && scrollY >= 0) {
    requestAnimationFrame(() => {
      window.scrollTo(0, scrollY);
    });
  }
}

      } catch {
        message.textContent = "記事を取得できませんでした。";
      }
    }
function renderPagination() {
  const paginationTop = document.getElementById("paginationTop");

  paginationTop.replaceChildren();
  pagination.replaceChildren();

  const totalPages = Math.ceil(totalArticles / pageSize);
  if (totalPages <= 1) return;

  const onPageChange = page => {
    GameNewsList.navigate(page);
  };

  paginationTop.appendChild(
    GamePagination.render(currentPage, totalPages, onPageChange)
  );

  pagination.appendChild(
    GamePagination.render(currentPage, totalPages, onPageChange)
  );
}

    function render() {
      list.replaceChildren();
      renderPagination();

      for (const status of ["pending", "published", "rejected"]) {
  document.getElementById(status + "Count").textContent = articleCounts[status] ?? "—";
}

      const filtered = articles.filter(a =>
        currentFilter === "all" || a.status === currentFilter
      );

      message.textContent = totalArticles
        ? `全${totalArticles}件中、${filtered.length}件を表示しています。`
        : "該当する記事はありません。";

      for (const article of filtered) {
        const item = document.createElement("div");
        item.className = "article";

        const card = document.createElement("div");
card.innerHTML = GameNewsCard.render(article, {
  clickable: false
});

const cardElement = card.querySelector(".card");

if (cardElement) {
  cardElement.style.cursor = "pointer";
  cardElement.setAttribute("role", "button");
  cardElement.setAttribute("tabindex", "0");

cardElement.addEventListener("click", () => {
  sessionStorage.setItem("editorScrollY", String(window.scrollY));
  const returnUrl = location.pathname + location.search;
  const params = new URLSearchParams({
    id: String(article.id),
    return: returnUrl
  });

  location.href = `/editor-article.html?${params.toString()}`;
});
  
cardElement.addEventListener("keydown", event => {
  if (event.key === "Enter" || event.key === " ") {
    event.preventDefault();
    cardElement.click();
  }
});

}

item.appendChild(cardElement || card);

        const top = document.createElement("div");
        top.className = "article-top";

        const badge = document.createElement("span");
        badge.className = "badge " + article.status;
        badge.textContent = labels[article.status] || "不明";

        top.appendChild(badge);

        const meta = document.createElement("div");
meta.className = "meta";

meta.textContent = article.processing_status !== "completed"
  ? "AI未評価"
  : `AI評価：${article.importance ?? 0}点`;

top.appendChild(meta);
const actions = document.createElement("div");
actions.className = "actions";
        const edit = document.createElement("button");
edit.className = "edit-btn";
edit.textContent = "編集";

        const publish = document.createElement("button");
        publish.className = "publish-btn";
        publish.textContent = "掲載";

        const reject = document.createElement("button");
        reject.className = "reject-btn";
        reject.textContent = "非掲載";

        if (article.status === "published") {
          publish.classList.add("selected");
          publish.disabled = true;
        }
        if (article.status === "rejected") {
          reject.classList.add("selected");
          reject.disabled = true;
        }

edit.addEventListener("click", () => {
  sessionStorage.setItem("editorScrollY", String(window.scrollY));
  const params = new URLSearchParams({
    id: String(article.id),
    return: location.pathname + location.search
  });
  location.href = `/editor-article.html?${params.toString()}`;
});

        publish.addEventListener("click", () =>
          updateStatus(article, "published", publish, reject)
        );
        reject.addEventListener("click", () =>
          updateStatus(article, "rejected", publish, reject)
        );

        actions.append(edit, publish, reject);

const management = document.createElement("div");
management.className = "article-management";
management.append(top, actions);
management.addEventListener("click", event => {
  event.stopPropagation();
});
(cardElement || card).appendChild(management);
list.appendChild(item);
      }
    }

 
async function updateStatus(article, status, publish, reject) {
  const action = status === "published" ? "掲載" : "非掲載";
  if (!confirm(`この記事を${action}に変更しますか？`)) return;

  publish.disabled = true;
  reject.disabled = true;
  message.textContent = "変更を保存中...";

  try {
    const success = await GameEditorStatus.update(
      Number(article.id),
      status
    );

    if (!success) return;

    await loadArticles();
  } catch (error) {
    console.error("掲載状態の変更エラー:", error);
    message.textContent = "変更に失敗しました。";
    render();
  }
}


function updateFilterButtons() {
  document.querySelectorAll("[data-filter]").forEach(button => {
    const active = button.dataset.filter === currentFilter;
    button.classList.toggle("active", active);
    button.setAttribute("aria-pressed", String(active));
  });
}

function changeFilter(filter) {
  if (!validFilters.includes(filter)) return;

  currentFilter = filter;
  currentPage = 1;

  const url = new URL(window.location.href);
  url.searchParams.set("status", currentFilter);
  url.searchParams.set("page", "1");
  window.history.replaceState(null, "", url);

  updateFilterButtons();
  loadArticles();
}

document.addEventListener("click", event => {
  const button = event.target.closest("[data-filter]");
  if (!button) return;

  changeFilter(button.dataset.filter);
});

updateFilterButtons();


    document.addEventListener("click", async (event) => {
  if (!event.target.closest("#logoutButton")) return;

  message.textContent = "ログアウト中...";

  try {
    const response = await fetch("/api/editor-logout", {
      method: "POST",
      credentials: "same-origin"
    });

    if (!response.ok) throw new Error("ログアウト失敗");

    location.replace("/editor.html");
  } catch {
    message.textContent = "ログアウトできませんでした。";
  }
});
    
    loadArticles();
  </script>
</body>
</html>
