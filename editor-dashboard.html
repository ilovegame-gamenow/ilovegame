<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>I LOVE GAME♪ 編集室</title>
  <link rel="stylesheet" href="/header.css">
  <link rel="stylesheet" href="/news-card.css">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #fff8f1;
      color: #333;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    }
    button {
      cursor: pointer;
      font: inherit;
      border-radius: 9px;
      padding: 10px 14px;
    }
    button:disabled { cursor: default; opacity: .65; }
    .logout {
  background: #fff3e9;
  border: 1px solid #ff7a2f;
  color: #d65f18;
  font-weight: 700;
}
.editor-header-actions {
  display: flex;
  align-items: center;
  gap: 12px;
}
.editor-header-label {
  font-size: 18px;
  font-weight: 800;
  white-space: nowrap;
}
    main {
      max-width: 1100px;
      margin: 24px auto;
      padding: 0 16px;
    }
    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 22px;
    }
    .stat {
      background: white;
      border-radius: 14px;
      padding: 18px;
      border-top: 4px solid;
    }
    .stat.pending { border-color: #e99425; }
    .stat.published { border-color: #249a69; }
    .stat.rejected { border-color: #8c929b; }
    .stat-label { font-size: 13px; color: #666; }
    .stat-count {
      font-size: 28px;
      font-weight: bold;
      margin-top: 5px;

     .panel {
      background: transparent;
      border-radius: 0;
      padding: 0;
    }
      
    .tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 20px;
    }
    .tab {
      background: #f5f5f5;
      border: 1px solid #ddd;
      color: #555;
    }
    .tab.active {
      background: #ff8a3d;
      border-color: #ff8a3d;
      color: white;
      font-weight: bold;
    }
    .article {
      padding: 18px 0;
      border-bottom: 1px solid #eee;
    }
    .article:last-child { border-bottom: 0; }
    .article-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
    }
    .article-title {
      font-size: 16px;
      font-weight: bold;
      line-height: 1.6;
    }
    .meta {
      font-size: 13px;
      color: #777;
      margin: 8px 0 14px;
    }
    .badge {
      display: inline-block;
      white-space: nowrap;
      padding: 5px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
    }
    .badge.pending {
      background: #fff0d8;
      color: #a76300;
    }
    .badge.published {
      background: #ddf5e9;
      color: #16784e;
    }
    .badge.rejected {
      background: #eceef0;
      color: #59616b;
    }
    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .publish-btn {
      border: 1px solid #249a69;
      background: white;
      color: #16784e;
    }
    .publish-btn.selected {
      background: #249a69;
      color: white;
    }
    .reject-btn {
      border: 1px solid #8c929b;
      background: white;
      color: #59616b;
    }
    .reject-btn.selected {
      background: #727b86;
      color: white;
    }
    .message { color: #666; font-size: 14px; }
    /* 編集室の記事カード一覧 */
#articlesList {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 12px;
}
    @media (max-width: 900px) {
  #articlesList {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}

@media (max-width: 480px) {
  #articlesList {
    grid-template-columns: 1fr;
  }
}

#articlesList .article {
  min-width: 0;
  padding: 0;
  border-bottom: none;
}

#articlesList .card {
  height: 100%;
}

    @media (max-width: 600px) {
      h1 { font-size: 18px; }
      .stats { gap: 8px; }
      .stat { padding: 12px; }
      .stat-count { font-size: 23px; }
      .panel { padding: 15px; }
      .article-top { flex-direction: column; }
    }

    /* 記事プレビュー */
    #previewDialog {
      width: min(720px, calc(100% - 24px));
      max-height: 88vh;
      padding: 0;
      border: none;
      border-radius: 18px;
      box-shadow: 0 15px 60px #0003;
    }

    #previewDialog::backdrop {
      background: #0009;
    }

    .preview-content {
      padding: 24px;
      max-height: 88vh;
      overflow-y: auto;
    }

    #closePreview {
      display: block;
      margin-left: auto;
      margin-bottom: 16px;
      background: #f3f3f3;
      color: #333;
    }

    #previewTitle {
      font-size: 22px;
      line-height: 1.5;
      margin: 0 0 18px;
    }

    #previewBody {
      font-size: 15px;
      line-height: 1.8;
      overflow-wrap: anywhere;
    }

    #previewBody img {
      display: block;
      max-width: 100%;
      height: auto;
      border-radius: 12px;
      margin: 16px 0;
    }

    #previewBody a {
      color: #d66b20;
    }

    #previewBody .preview-point {
      background: #fff4e8;
      padding: 16px;
      border-radius: 12px;
      margin: 20px 0;
    }


  </style>
</head>
<body data-page="editor">
  <header></header>
  <main>
    <div class="stats">
      <div class="stat pending">
        <div class="stat-label">審査待ち</div>
        <div class="stat-count" id="pendingCount">—</div>
      </div>
      <div class="stat published">
        <div class="stat-label">掲載中</div>
        <div class="stat-count" id="publishedCount">—</div>
      </div>
      <div class="stat rejected">
        <div class="stat-label">非掲載</div>
        <div class="stat-count" id="rejectedCount">—</div>
      </div>
    </div>

    <section class="panel">
      <div class="tabs" id="tabs">
        <button class="tab active" data-filter="pending">審査待ち</button>
        <button class="tab" data-filter="published">掲載中</button>
        <button class="tab" data-filter="rejected">非掲載</button>
        <button class="tab" data-filter="all">すべて</button>
      </div>
      <p class="message" id="message" role="status" aria-live="polite"></p>
      <div id="articlesList"></div>
      <div id="pagination" class="tabs"></div>
    </section>
  </main>
  <!-- 記事プレビュー -->
  <dialog id="previewDialog" aria-labelledby="previewTitle">
    <div class="preview-content">
      <button type="button" id="closePreview">× 閉じる</button>

      <h2 id="previewTitle">記事プレビュー</h2>

      <div id="previewBody">
        記事を読み込み中...
      </div>
    </div>
  </dialog>
  <script src="/image-utils.js"></script>
  <script src="/date-utils.js"></script>
  <script src="/news-card.js"></script>
  <script src="/header.js"></script>
  <script>
    const list = document.getElementById("articlesList");
    const message = document.getElementById("message");
    const tabs = document.getElementById("tabs");

    let articles = [];
    let currentFilter = "pending";
    const pagination = document.getElementById("pagination");
    let currentPage = 1;
    let totalArticles = 0;
    const pageSize = 20;
    let articleCounts = { pending: 0, published: 0, rejected: 0 };
    const labels = {
      pending: "審査待ち",
      published: "掲載中",
      rejected: "非掲載"
    };

    async function loadArticles() {
      message.textContent = "記事を読み込み中...";

      try {
        const response = await fetch(`/api/editor-news?page=${currentPage}&status=${currentFilter}`, {
          credentials: "same-origin",
          cache: "no-store"
        });

        if (response.status === 401) {
          location.replace("/editor.html");
          return;
        }

        if (!response.ok) throw new Error("取得失敗");

        const data = await response.json();
        articles = data.articles || [];
        totalArticles = data.total ?? 0;
        articleCounts = data.counts || { pending: 0, published: 0, rejected: 0 };
        render();
      } catch {
        message.textContent = "記事を取得できませんでした。";
      }
    }
function renderPagination() {
  pagination.replaceChildren();

  const totalPages = Math.ceil(totalArticles / pageSize);
  if (totalPages <= 1) return;

  const previous = document.createElement("button");
  previous.className = "tab";
  previous.textContent = "← 前へ";
  previous.disabled = currentPage === 1;
  previous.addEventListener("click", () => {
    currentPage--;
    loadArticles();
  });

  const indicator = document.createElement("span");
  indicator.textContent = `${currentPage} / ${totalPages} ページ`;
  indicator.style.alignSelf = "center";

  const next = document.createElement("button");
  next.className = "tab";
  next.textContent = "次へ →";
  next.disabled = currentPage >= totalPages;
  next.addEventListener("click", () => {
    currentPage++;
    loadArticles();
  });

  pagination.append(previous, indicator, next);
}
    function render() {
      list.replaceChildren();
      renderPagination();

      for (const status of ["pending", "published", "rejected"]) {
  document.getElementById(status + "Count").textContent = articleCounts[status] ?? "—";
}

      const filtered = articles.filter(a =>
        currentFilter === "all" || a.status === currentFilter
      );

      message.textContent = totalArticles
        ? `全${totalArticles}件中、${filtered.length}件を表示しています。`
        : "該当する記事はありません。";

      for (const article of filtered) {
        const item = document.createElement("div");
        item.className = "article";

        const card = document.createElement("div");
card.innerHTML = GameNewsCard.render(article, {
  clickable: false
});

const cardElement = card.querySelector(".card");

if (cardElement) {
  cardElement.style.cursor = "pointer";
  cardElement.setAttribute("role", "button");
  cardElement.setAttribute("tabindex", "0");

  cardElement.addEventListener("click", () => {
    openPreview(article.id);
  });

  cardElement.addEventListener("keydown", event => {
    if (event.key === "Enter" || event.key === " ") {
      event.preventDefault();
      openPreview(article.id);
    }
  });
}

item.appendChild(card);

        const top = document.createElement("div");
        top.className = "article-top";

        const badge = document.createElement("span");
        badge.className = "badge " + article.status;
        badge.textContent = labels[article.status] || "不明";

        top.appendChild(badge);

        const meta = document.createElement("div");
meta.className = "meta";
meta.textContent = `AI評価：${article.importance ?? "未評価"}点`;

top.appendChild(meta);

        const actions = document.createElement("div");
        actions.className = "actions";

        const publish = document.createElement("button");
        publish.className = "publish-btn";
        publish.textContent = "掲載する";

        const reject = document.createElement("button");
        reject.className = "reject-btn";
        reject.textContent = "非掲載にする";

        if (article.status === "published") {
          publish.classList.add("selected");
          publish.disabled = true;
        }
        if (article.status === "rejected") {
          reject.classList.add("selected");
          reject.disabled = true;
        }

        publish.addEventListener("click", () =>
          updateStatus(article, "published", publish, reject)
        );
        reject.addEventListener("click", () =>
          updateStatus(article, "rejected", publish, reject)
        );

        actions.append(publish, reject);
        item.append(top, actions);
        list.appendChild(item);
      }
    }

    async function updateStatus(article, status, publish, reject) {
      const action = status === "published" ? "掲載" : "非掲載";
      if (!confirm(`この記事を${action}に変更しますか？`)) return;

      publish.disabled = true;
      reject.disabled = true;
      message.textContent = "変更を保存中...";

      try {
        const response = await fetch("/api/editor-update", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "same-origin",
          body: JSON.stringify({ id: article.id, status })
        });

        if (response.status === 401) {
          location.replace("/editor.html");
          return;
        }
        if (!response.ok) throw new Error("保存失敗");

        await loadArticles();
      } catch {
        message.textContent = "変更に失敗しました。";
        render();
      }
    }

    tabs.addEventListener("click", event => {
      const button = event.target.closest("[data-filter]");
      if (!button) return;

      currentFilter = button.dataset.filter;
      for (const tab of tabs.querySelectorAll(".tab")) {
        tab.classList.toggle("active", tab === button);
      }
      currentPage = 1;
      loadArticles();
    });

    document.addEventListener("click", async (event) => {
  if (!event.target.closest("#logoutButton")) return;

  message.textContent = "ログアウト中...";

  try {
    const response = await fetch("/api/editor-logout", {
      method: "POST",
      credentials: "same-origin"
    });

    if (!response.ok) throw new Error("ログアウト失敗");

    location.replace("/editor.html");
  } catch {
    message.textContent = "ログアウトできませんでした。";
  }
});
      const previewDialog = document.getElementById("previewDialog");
      const previewTitle = document.getElementById("previewTitle");
      const previewBody = document.getElementById("previewBody");

      document.getElementById("closePreview")
        .addEventListener("click", () => previewDialog.close());

      previewDialog.addEventListener("click", (event) => {
        if (event.target === previewDialog) previewDialog.close();
      });

      async function openPreview(id) {
        previewTitle.textContent = "記事プレビュー";
        previewBody.textContent = "記事を読み込み中...";
        previewDialog.showModal();

        try {
          const response = await fetch(
            `/api/editor-detail?id=${encodeURIComponent(id)}`,
            {
              credentials: "same-origin",
              cache: "no-store"
            }
          );

          if (response.status === 401) {
            location.replace("/editor.html");
            return;
          }

          if (!response.ok) throw new Error("取得失敗");

          const data = await response.json();
          const article = data.article;

          previewTitle.textContent = article.title || "タイトルなし";
          previewBody.replaceChildren();

          function addText(label, value) {
            if (!value) return;
            const section = document.createElement("p");
            const strong = document.createElement("strong");
            strong.textContent = label + "：";
            section.append(strong, document.createTextNode(String(value)));
            previewBody.appendChild(section);
          }

          
const imageUrl = GameImage.getUrl(
  article.thumbnail_url,
  article.source_name
);

if (imageUrl) {
  const img = document.createElement("img");
  img.src = imageUrl;
  img.alt = article.title || "記事画像";
  img.loading = "lazy";
  previewBody.appendChild(img);
}


          addText("掲載状態", {
            pending: "審査待ち",
            published: "掲載中",
            rejected: "非掲載"
          }[article.status] || "不明");

          addText("AI評価", article.importance == null
            ? "未評価"
            : `${article.importance}点`);

          addText("概要", article.summary);

          const body = document.createElement("div");
          body.style.whiteSpace = "pre-wrap";
          body.textContent = article.article_body || "記事本文はまだありません。";
          previewBody.appendChild(body);

          if (article.ilovegame_point) {
            const point = document.createElement("div");
            point.className = "preview-point";
            const heading = document.createElement("strong");
            heading.textContent = "ここに注目♪";
            const description = document.createElement("p");
            description.textContent = article.ilovegame_point;
            point.append(heading, description);
            previewBody.appendChild(point);
          }

          if (article.source_url) {
            const link = document.createElement("a");
            link.href = article.source_url;
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.textContent = "元記事を開く ↗";
            previewBody.appendChild(link);
          }
        } catch {
          previewBody.textContent = "記事を取得できませんでした。";
        }
      }


    loadArticles();
  </script>
</body>
</html>
