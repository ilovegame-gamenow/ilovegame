<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>新作ゲーム発売日カレンダー | I LOVE GAME♪</title>
<meta name="description" content="次に遊ぶゲームを、発売日から見つけよう。新作ゲームの発売予定を月・機種別にチェック。">
<link rel="stylesheet" href="/header.css"><link rel="stylesheet" href="/release-cards.css"><link rel="stylesheet" href="/calendar.css"></head>
<body><header></header><main class="calendar-main">
<section class="calendar-hero"><h1>発売日カレンダー</h1><a class="home-link" href="/">← ゲームニュースへ</a></section>
<p id="demoNotice" class="notice" hidden>表示サンプル：作品名・発売日は架空です。</p>
<section class="calendar-panel" aria-labelledby="monthHeading">
<div class="calendar-toolbar"><div class="month-navigation"><button id="previousMonth" type="button" aria-label="前の月">←</button><h2 id="monthHeading">発売予定</h2><button id="nextMonth" type="button" aria-label="次の月">→</button><button id="currentMonth" type="button">今月</button></div>
<div class="calendar-filters"><label>機種<select id="platformFilter"><option value="">すべての機種</option></select></label><label>発売地域<select id="regionFilter"><option value="JP">日本</option><option value="WW">全世界（日本発売未確認）</option></select></label></div>
</div>
<p id="regionNotice" class="calendar-note" hidden>全世界向けの発表です。日本での発売や日本語対応を確認した情報ではありません。</p>
<p id="calendarMessage" role="status" aria-live="polite">発売情報を読み込んでいます…</p><button id="retryCalendar" type="button" hidden>もう一度読み込む</button>

<div id="calendarGrid" class="month-grid" aria-label="発売日を選ぶ"></div>
<button id="showAllDays" class="text-button" type="button" hidden>この月の発売日をすべて見る</button>
</section>
<section class="releases-section" aria-labelledby="releaseHeading"><div class="list-heading"><h2 id="releaseHeading">この月に遊べる新作</h2><span id="releaseCount"></span></div><div id="releaseList"></div></section>
<section id="monthOnlySection" class="releases-section" aria-labelledby="monthOnlyHeading" hidden><div class="list-heading"><h2 id="monthOnlyHeading">この月の発売予定</h2><span>日付は発表待ち</span></div><div id="monthOnlyList"></div></section>
<p class="calendar-note">公式サイト・ストアで確認した発売予定を掲載します。予定は変更されることがあります。購入前にリンク先の最新情報をご確認ください。早期アクセスは正式発売と分けて表示します。</p>
</main><footer>I LOVE GAME♪ — 次の楽しみを見つけよう。</footer><script src="/header.js"></script><script type="module" src="/calendar.js"></script></body></html>
