<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>過去のニュース | I LOVE GAME♪</title>

<style>
*{box-sizing:border-box}

:root{
  --orange:#ff7a2f;
  --cream:#fff8f0;
  --ink:#24201d;
  --muted:#77706a;
  --line:#eee2d7;
  --white:#fff;
}

body{
  margin:0;
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
  background:var(--cream);
}

header{
  background:var(--white);
  border-bottom:3px solid var(--orange);
  padding:18px 20px;
}

.header-inner{
  max-width:1100px;
  margin:auto;
}

.logo{
  font-size:28px;
  font-weight:1000;
}

.logo .love,
.music{
  color:var(--orange);
}

.tagline{
  font-size:11px;
  color:var(--muted);
  margin-top:5px;
  font-weight:700;
}

main{
  max-width:1100px;
  margin:auto;
  padding:28px 20px 65px;
}

.back{
  display:inline-block;
  margin-bottom:24px;
  color:var(--orange);
  text-decoration:none;
  font-weight:900;
}

h1{
  font-size:26px;
  margin:0 0 8px;
}

.description{
  color:var(--muted);
  font-size:13px;
  margin-bottom:25px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:14px;
}

.card{
  background:var(--white);
  border:1px solid var(--line);
  border-radius:18px;
  padding:17px;
  cursor:pointer;
  box-shadow:0 4px 14px #d78f6317;
}

.thumb{
  width:100%;
  aspect-ratio:16/9;
  object-fit:cover;
  border-radius:14px;
  margin-bottom:12px;
}

.thumb-placeholder{
  width:100%;
  aspect-ratio:16/9;
  border-radius:14px;
  background:linear-gradient(135deg,#ff7a2f,#ffb36f);
  display:grid;
  place-items:center;
  color:#fff;
  font-weight:1000;
  margin-bottom:12px;
}

.meta{
  font-size:12px;
  color:var(--muted);
}

.time{
  font-size:11px;
  color:var(--orange);
  font-weight:900;
  margin:5px 0 9px;
}

.card h3{
  font-size:16px;
  line-height:1.5;
  margin:0 0 10px;
}

.card p{
  font-size:13px;
  line-height:1.6;
  color:#5f5853;
}

footer{
  background:#25211e;
  color:#fff;
  padding:30px;
  text-align:center;
  font-size:12px;
}

@media(max-width:800px){
  .grid{grid-template-columns:1fr 1fr}
}

@media(max-width:600px){
  .grid{grid-template-columns:1fr}
}
</style>
</head>

<body>

<header>
  <div class="header-inner">
    <div class="logo">
      I <span class="love">LOVE</span> GAME<span class="music">♪</span>
    </div>
    <div class="tagline">ゲームの「今」をお届け♪</div>
  </div>
</header>

<main>

<a class="back" href="index.html">← トップへ戻る</a>

<h1>過去のニュース</h1>
<div class="description">I LOVE GAME♪で紹介したゲームニュースをまとめています。</div>

<section id="archive" class="grid"></section>

</main>

<footer>
I LOVE GAME♪　ゲームの「今」をお届け♪
</footer>

<script src="/date-utils.js"></script>

<script>

function esc(s){
  return String(s??"").replace(/[&<>"']/g,m=>({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#039;"
  }[m]));
}

async function loadArchive(){

  try{

    const r=await fetch("/api/news");
    const rows=await r.json();

    const archive=document.getElementById("archive");

    const oldNews=rows.slice(20);

    if(!oldNews.length){
      archive.innerHTML="<p>過去のニュースはまだありません。</p>";
      return;
    }

    archive.innerHTML=oldNews.map(a=>{

      const updateTime=a.site_published_at||a.created_at||a.published_at;

      const updateLabel=GameDate.format(updateTime);

      return `
      <article class="card"
        onclick="location.href='article.html?id=${encodeURIComponent(a.id)}'">

        ${a.thumbnail_url
          ?`<img class="thumb"
             src="https://assets.topics.apps-jp.nintendo.com/image/${esc(a.thumbnail_url)}"
             alt="${esc(a.title)}">`
          :`<div class="thumb-placeholder">I LOVE GAME♪</div>`
        }

        <div class="meta">
          ${esc(a.category||"NEWS")} ・ ${esc(a.source_name||"")}
        </div>

        <div class="time">${esc(updateLabel)} UP</div>

        <h3>${esc(a.title)}</h3>

        <p>${esc(a.summary||"")}</p>

      </article>
      `;

    }).join("");

  }catch(e){

    console.error(e);

    document.getElementById("archive").innerHTML=
      "<p>ニュースを読み込めませんでした。</p>";

  }

}

loadArchive();

</script>

</body>
</html>
