name: Test PlayStation OG Image

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-og-image:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Inspect PlayStation article images
        run: |
          node --input-type=module <<'JS'
          import assert from "node:assert/strict";

          const rssResponse = await fetch(
            "https://blog.ja.playstation.com/feed/"
          );

          assert.ok(
            rssResponse.ok,
            `RSS fetch failed: ${rssResponse.status}`
          );

          const xml = await rssResponse.text();

          const items =
            xml.match(/<item\b[^>]*>[\s\S]*?<\/item>/gi) || [];

          console.log(`RSS items: ${items.length}`);

          for (const [index, item] of items.slice(0, 5).entries()) {
            const linkMatch = item.match(
              /<link>([\s\S]*?)<\/link>/i
            );

            assert.ok(linkMatch, "Article URL not found");

            const articleUrl = linkMatch[1].trim();

            const response = await fetch(articleUrl, {
              headers: {
                "User-Agent": "Mozilla/5.0"
              }
            });

            assert.ok(
              response.ok,
              `Article fetch failed: ${response.status}`
            );

            const html = await response.text();

            // 属性の順序に依存せずog:imageを探す
            const metaTags =
              html.match(/<meta\b[^>]*>/gi) || [];

            let ogImage = null;

            for (const tag of metaTags) {
              if (
                !/\b(?:property|name)\s*=\s*["']og:image["']/i.test(tag)
              ) {
                continue;
              }

              const content = tag.match(
                /\bcontent\s*=\s*["']([^"']+)["']/i
              );

              if (content) {
                ogImage = content[1].replace(/&amp;/g, "&");
                break;
              }
            }

            console.log(`--- Article ${index + 1} ---`);
            console.log(`URL: ${articleUrl}`);
            console.log(`OG image: ${ogImage || "Not found"}`);

            const rssImages = [
              ...item.matchAll(
                /<img\b[^>]*\bsrc=["']([^"']+)["']/gi
              )
            ];

            console.log(`RSS images: ${rssImages.length}`);

            for (const [imageIndex, match] of
              rssImages.slice(0, 3).entries()) {
              console.log(
                `RSS image ${imageIndex + 1}: ${match[1].replace(/&amp;/g, "&")}`
              );
            }
          }

          console.log("PlayStation OG image inspection completed.");
          JS
