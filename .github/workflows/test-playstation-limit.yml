
name: Test PlayStation Limit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-playstation-limit:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify single-article limit
        env:
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_SECRET_KEY: test-key
          CRON_SECRET: test-cron-secret
        run: |
          node --input-type=module <<'JS'
          import assert from "node:assert/strict";
          import handler from "./api/collect-playstation-queue.js";

          const savedArticles = [];

          const sampleRss = `
            <rss>
              <channel>
                <item>
                  <title><![CDATA[PlayStationテスト記事1]]></title>
                  <link>https://blog.ja.playstation.com/test1/</link>
                  <pubDate>Fri, 23 Oct 2026 09:00:00 GMT</pubDate>
                </item>
                <item>
                  <title><![CDATA[PlayStationテスト記事2]]></title>
                  <link>https://blog.ja.playstation.com/test2/</link>
                  <pubDate>Fri, 23 Oct 2026 10:00:00 GMT</pubDate>
                </item>
              </channel>
            </rss>
          `;

          globalThis.fetch = async (url, options = {}) => {
            const requestUrl = String(url);

            if (requestUrl === "https://blog.ja.playstation.com/feed/") {
              return new Response(sampleRss, { status: 200 });
            }

            if (
              requestUrl === "https://blog.ja.playstation.com/test1/" ||
              requestUrl === "https://blog.ja.playstation.com/test2/"
            ) {
              return new Response(
                '<meta property="og:image" content="https://example.com/og.jpg">',
                { status: 200 }
              );
            }

            if (requestUrl.startsWith("https://example.supabase.co/")) {
              if (options.method === "POST") {
                savedArticles.push(JSON.parse(options.body));
                return new Response(null, { status: 201 });
              }

              return Response.json([]);
            }

            throw new Error(`Unexpected request: ${requestUrl}`);
          };

          let statusCode;
          let responseBody;

          await handler(
            {
              headers: {
                authorization: "Bearer test-cron-secret"
              },
              query: {
                test: "1"
              }
            },
            {
              status(code) {
                statusCode = code;
                return this;
              },
              json(body) {
                responseBody = body;
                return this;
              }
            }
          );

          assert.equal(statusCode, 200);
          assert.equal(responseBody.success, true);
          assert.equal(responseBody.checked, 1);
          assert.equal(responseBody.pending, 1);
          assert.equal(responseBody.results.length, 1);
          assert.equal(savedArticles.length, 1);

          console.log("Two RSS articles detected, one registered: PASS");
          console.log("PlayStation single-article limit: PASS");
          JS
