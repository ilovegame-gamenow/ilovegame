name: Test PlayStation Queue

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-playstation-queue:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Test PlayStation queue without database
        env:
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_SECRET_KEY: test-key
          CRON_SECRET: test-cron-secret
        run: |
          node --input-type=module <<'JS'
          import assert from "node:assert/strict";
          import handler from "./api/collect-playstation-queue.js";

          const savedArticles = [];
          const requests = [];

          const sampleRss = `
            <rss>
              <channel>
                <item>
                  <title><![CDATA[PlayStationテスト記事]]></title>
                  <link>https://blog.ja.playstation.com/test/</link>
                  <pubDate>Fri, 23 Oct 2026 09:00:00 GMT</pubDate>
                  <description><![CDATA[
                    <img src="https://example.com/rss.jpg">
                  ]]></description>
                </item>
                
                  <item>
                    <title>PlayStationテスト記事2</title>
                    <link>https://blog.ja.playstation.com/test2/</link>
                    <pubDate>Fri, 23 Oct 2026 10:00:00 GMT</pubDate>
                  </item>

              </channel>
            </rss>
          `;

          globalThis.fetch = async (url, options = {}) => {
            const requestUrl = String(url);
            requests.push(requestUrl);

            // PlayStation RSS
            if (requestUrl === "https://blog.ja.playstation.com/feed/") {
              return new Response(sampleRss, {
                status: 200
              });
            }

            // PlayStation記事ページ（OG画像）
            if (requestUrl === "https://blog.ja.playstation.com/test/") {
              return new Response(`
                <html>
                  <head>
                    <meta property="og:image"
                      content="https://example.com/og.jpg">
                  </head>
                </html>
              `, {
                status: 200
              });
            }
            
          // 2件目のPlayStation記事ページ
          if (requestUrl === "https://blog.ja.playstation.com/test2/") {
            return new Response(`
              <html>
                <head>
                  <meta property="og:image"
                    content="https://example.com/og2.jpg">
                </head>
              </html>
            `, {
              status: 200
            });
          }

            // Supabaseの模擬応答
            if (requestUrl.startsWith("https://example.supabase.co/")) {
              if (options.method === "POST") {
                savedArticles.push(JSON.parse(options.body));

                return new Response(null, {
                  status: 201
                });
              }

              return Response.json([]);
            }

            throw new Error(`Unexpected request: ${requestUrl}`);
          };

          let statusCode;
          let responseBody;

          const req = {
            headers: {
              authorization: "Bearer test-cron-secret"
            }
          };

          const res = {
            status(code) {
              statusCode = code;
              return this;
            },
            json(body) {
              responseBody = body;
              return this;
            }
          };
          
          // 認証エラー時は収集処理を実行しない
          const requestsBeforeAuthTest = requests.length;

          let unauthorizedStatus;
          let unauthorizedBody;

          await handler(
            {
              headers: {
                authorization: "Bearer wrong-secret"
              }
            },
            {
              status(code) {
                unauthorizedStatus = code;
                return this;
              },
              json(body) {
                unauthorizedBody = body;
                return this;
              }
            }
          );

          assert.equal(unauthorizedStatus, 401);
          assert.equal(unauthorizedBody.success, false);
          assert.equal(requests.length, requestsBeforeAuthTest);

          console.log("Unauthorized access protection: PASS");

          await handler(req, res);

          assert.equal(statusCode, 200);
          assert.equal(responseBody.success, true);
          assert.equal(responseBody.checked, 2);
          assert.equal(responseBody.pending, 2);
          assert.equal(responseBody.existing, 0);
          assert.equal(responseBody.error, 0);

          assert.equal(savedArticles.length, 2);

          const article = savedArticles[0];

          assert.equal(article.source_name, "PlayStation");
          assert.equal(article.source_title, "PlayStationテスト記事");
          assert.equal(
            article.source_url,
            "https://blog.ja.playstation.com/test/"
          );
          assert.equal(
            article.thumbnail_url,
            "https://example.com/og.jpg"
          );
          assert.equal(article.status, "pending");
          assert.equal(article.processing_status, "pending");
          assert.equal(article.importance, 0);

          console.log("PlayStation collection: PASS");
          console.log("OG image priority: PASS");
          console.log("Pending registration: PASS");
          
          // 1件制限モードの確認
          const savedCountBeforeTest = savedArticles.length;

          let limitedStatus;
          let limitedBody;

          await handler(
            {
              headers: {
                authorization: "Bearer test-cron-secret"
              },
              query: {
                test: "1"
              }
            },
            {
              status(code) {
                limitedStatus = code;
                return this;
              },
              json(body) {
                limitedBody = body;
                return this;
              }
            }
          );

          assert.equal(limitedStatus, 200);
          assert.equal(limitedBody.success, true);
          assert.equal(limitedBody.checked, 1);
          assert.equal(limitedBody.pending, 1);
          assert.equal(limitedBody.results.length, 1);
          assert.equal(
            savedArticles.length - savedCountBeforeTest,
            1
          );
          console.log("Single-article test mode: PASS");

          console.log("All PlayStation queue tests passed.");
          JS
