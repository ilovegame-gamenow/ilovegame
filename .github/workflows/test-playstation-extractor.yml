name: Test PlayStation Extractor

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-extractor:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Test PlayStation article extraction
        run: |
          node --input-type=module <<'JS'
          import { extractPlayStationArticleHtml } from "./lib/playstation-extractor.js";

          const feedUrl = "https://blog.ja.playstation.com/feed/";

          const feedResponse = await fetch(feedUrl);

          if (!feedResponse.ok) {
            throw new Error(`RSS fetch failed: ${feedResponse.status}`);
          }

          const rss = await feedResponse.text();

          const links = [
            ...rss.matchAll(/<link>(https:\/\/blog\.ja\.playstation\.com\/[^<]+)<\/link>/g)
          ]
            .map(match => match[1].replace(/&amp;/g, "&"))
            .filter(url => !url.endsWith("/feed/"))
            .slice(0, 3);

          if (links.length === 0) {
            throw new Error("No article URLs found in RSS");
          }

          console.log("Articles to test:", links.length);

          for (const url of links) {
            const response = await fetch(url);

            if (!response.ok) {
              throw new Error(`Article fetch failed: ${response.status}`);
            }

            const html = await response.text();
            const extracted = extractPlayStationArticleHtml(html);

            console.log("---");
            console.log("URL:", url);
            console.log("Body found:", extracted !== null);
            console.log("HTML length:", extracted?.length ?? 0);
            console.log("HTML preview:", extracted?.slice(0, 300) ?? "");
            console.log("HTML ending:", extracted?.slice(-300) ?? "");

            if (!extracted || extracted.length < 100) {
              throw new Error("PlayStation extraction failed");
            }
          }
          JS
