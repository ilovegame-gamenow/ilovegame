name: Test Article Queue

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-queue:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Test queue repository without database
        run: |
          node --input-type=module <<'JS'
          import assert from "node:assert/strict";
          import { registerPendingArticle } from "./lib/article-queue-repository.js";

          const originalFetch = globalThis.fetch;
          const requests = [];
          let existingArticles = [];
          let saveStatus = 201;
          let saveError = "";

          globalThis.fetch = async (url, options = {}) => {
            requests.push({
              url: String(url),
              options
            });

            if (options.method === "POST") {
              return new Response(saveError, {
                status: saveStatus
              });
            }

            return Response.json(existingArticles);
          };

          const item = {
            source_title: "テスト記事",
            source_name: "PlayStation",
            source_url: "https://example.com/article",
            source_published_at: "2026-10-24T09:00:00Z",
            thumbnail_url: "https://example.com/image.jpg"
          };

          const config = {
            supabaseUrl: "https://example.supabase.co",
            supabaseKey: "test-key"
          };

          try {
            // 1. 新着記事
            let result = await registerPendingArticle(item, config);
            assert.equal(result.status, "pending");
            assert.equal(requests.length, 2);

            const saved = JSON.parse(requests[1].options.body);
            assert.equal(saved.source_name, "PlayStation");
            assert.equal(saved.status, "pending");
            assert.equal(saved.processing_status, "pending");
            assert.equal(saved.importance, 0);
            console.log("New article: PASS");

            // 2. 既存記事
            requests.length = 0;
            existingArticles = [{ id: 123 }];

            result = await registerPendingArticle(item, config);
            assert.equal(result.status, "existing");
            assert.equal(requests.length, 1);
            console.log("Existing article: PASS");

            // 3. 同時登録による重複
            requests.length = 0;
            existingArticles = [];
            saveStatus = 409;
            saveError = "duplicate key";

            result = await registerPendingArticle(item, config);
            assert.equal(result.status, "existing");
            console.log("Duplicate article: PASS");

            // 4. 保存エラー
            saveStatus = 400;
            saveError = "invalid data";

            result = await registerPendingArticle(item, config);
            assert.equal(result.status, "error");
            console.log("Save error: PASS");

            console.log("All article queue tests passed.");
          } finally {
            globalThis.fetch = originalFetch;
          }
          JS
