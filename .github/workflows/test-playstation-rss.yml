name: Test PlayStation RSS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-rss:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Fetch PlayStation RSS
        run: |
          python3 - <<'PY'
          import urllib.request
          import xml.etree.ElementTree as ET
          import re
          import html as html_lib
          from html.parser import HTMLParser

          RSS_URL = "https://blog.ja.playstation.com/feed/"

          VOID_TAGS = {
              "area", "base", "br", "col", "embed",
              "hr", "img", "input", "link", "meta",
              "param", "source", "track", "wbr"
          }

          class ArticleBodyParser(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.depth = 0
                  self.parts = []
                  self.found = False
                  self.skip_depth = 0

              def handle_starttag(self, tag, attrs):
                  classes = dict(attrs).get("class", "").split()

                  if self.depth == 0:
                      if "post-single__content" in classes:
                          self.depth = 1
                          self.found = True
                      return

                  if self.skip_depth:
                      if tag not in VOID_TAGS:
                          self.skip_depth += 1
                  elif tag in ("script", "style", "noscript"):
                      self.skip_depth = 1
                  elif tag not in VOID_TAGS:
                      self.depth += 1

              def handle_startendtag(self, tag, attrs):
                  pass

              def handle_endtag(self, tag):
                  if not self.depth:
                      return

                  if self.skip_depth:
                      self.skip_depth -= 1
                  else:
                      self.depth -= 1

              def handle_data(self, data):
                  if self.depth and not self.skip_depth:
                      self.parts.append(data)

          def fetch(url):
              request = urllib.request.Request(
                  url,
                  headers={"User-Agent": "Mozilla/5.0"}
              )
              with urllib.request.urlopen(
                  request, timeout=20
              ) as response:
                  print("HTTP status:", response.status)
                  return response.read(3_000_000).decode(
                      "utf-8", errors="replace"
                  )

          rss_xml = fetch(RSS_URL)
          root = ET.fromstring(rss_xml)
          items = root.findall("./channel/item")

          print("RSS items:", len(items))

          if not items:
              raise RuntimeError("No RSS items found")

          for item in items[:3]:
              print("---")
              print("Title:", item.findtext("title"))
              print("URL:", item.findtext("link"))
              print("Date:", item.findtext("pubDate"))
              print("Tags:", [child.tag for child in item])

              content = item.findtext(
                  "{http://purl.org/rss/1.0/modules/content/}encoded"
              ) or item.findtext("description") or ""

              images = re.findall(
                  r'<img[^>]+src=["\']([^"\']+)["\']',
                  content,
                  re.IGNORECASE
              )

              print("Images:", [
                  html_lib.unescape(url)
                  for url in images[:3]
              ])

              article_url = item.findtext("link")
              article_html = fetch(article_url)

              main_match = (
                  re.search(
                      r"<main[\s\S]*?</main>",
                      article_html,
                      re.IGNORECASE
                  )
                  or re.search(
                      r"<article[\s\S]*?</article>",
                      article_html,
                      re.IGNORECASE
                  )
              )

              main_html = (
                  main_match.group(0)
                  if main_match else article_html
              )

              clean_text = main_html
              for tag in ("script", "style", "nav", "footer"):
                  clean_text = re.sub(
                      rf"<{tag}\b[^>]*>[\s\S]*?</{tag}>",
                      " ",
                      clean_text,
                      flags=re.IGNORECASE
                  )

              clean_text = re.sub(
                  r"<[^>]+>", " ", clean_text
              )
              clean_text = html_lib.unescape(clean_text)
              clean_text = re.sub(
                  r"\s+", " ", clean_text
              ).strip()

              print("Extracted text length:", len(clean_text))
              print("Extracted text preview:", clean_text[:500])

              for tag_name in ("main", "article"):
                  matches = re.findall(
                      rf"<{tag_name}\b[^>]*>",
                      main_html,
                      re.IGNORECASE
                  )
                  print(f"{tag_name} tags:", matches[:5])

              class_matches = re.findall(
                  r'<(?:div|section)\b[^>]*class=["\']([^"\']+)["\']',
                  main_html,
                  re.IGNORECASE
              )

              content_classes = [
                  name for name in class_matches
                  if any(
                      word in name.lower()
                      for word in ("content", "body", "entry", "post")
                  )
              ]

              print("Content classes:", content_classes[:20])

              parser = ArticleBodyParser()
              parser.feed(main_html)

              body_text = re.sub(
                  r"\s+", " ", " ".join(parser.parts)
              ).strip()

              print("Body found:", parser.found)
              print("Body text length:", len(body_text))
              print("Body text preview:", body_text[:500])

              if not parser.found or len(body_text) < 100:
                  raise RuntimeError(
                      "PlayStation body extraction failed"
                  )
          PY
