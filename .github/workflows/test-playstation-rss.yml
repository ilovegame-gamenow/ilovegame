name: Test PlayStation RSS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-rss:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Fetch PlayStation RSS
        run: |
          python3 - <<'PY'
          import urllib.request
          import xml.etree.ElementTree as ET

          url = "https://blog.ja.playstation.com/feed/"
          request = urllib.request.Request(
              url,
              headers={"User-Agent": "Mozilla/5.0"}
          )

          with urllib.request.urlopen(request, timeout=20) as response:
              print("HTTP status:", response.status)
              print("Content-Type:", response.headers.get("Content-Type"))
              data = response.read(2_000_000)

          root = ET.fromstring(data)
          items = root.findall("./channel/item")

          print("RSS items:", len(items))

          for item in items[:3]:
              print("---")
              print("Title:", item.findtext("title"))
              print("URL:", item.findtext("link"))
              print("Date:", item.findtext("pubDate"))
              print("Tags:", [child.tag for child in item])
              
              import re
              content = item.findtext(
                  "{http://purl.org/rss/1.0/modules/content/}encoded"
              ) or item.findtext("description") or ""

              images = re.findall(
                  r'<img[^>]+src=["\']([^"\']+)["\']',
                  content,
                  re.IGNORECASE
              )

              print("Images:", images[:3])
              
              # 公式記事ページから本文を抽出するテスト
              article_url = item.findtext("link")
              article_request = urllib.request.Request(
                  article_url,
                  headers={"User-Agent": "Mozilla/5.0"}
              )

              with urllib.request.urlopen(
                  article_request, timeout=20
              ) as article_response:
                  article_html = article_response.read().decode(
                      "utf-8", errors="replace"
                  )

              import re
              import html as html_lib

              main_match = (
                  re.search(
                      r"<main[\s\S]*?</main>",
                      article_html,
                      re.IGNORECASE
                  )
                  or re.search(
                      r"<article[\s\S]*?</article>",
                      article_html,
                      re.IGNORECASE
                  )
              )

              article_html = (
                  main_match.group(0)
                  if main_match else article_html
              )

              clean_text = article_html
              for tag in ("script", "style", "nav", "footer"):
                  clean_text = re.sub(
                      rf"<{tag}\b[^>]*>[\s\S]*?</{tag}>",
                      " ",
                      clean_text,
                      flags=re.IGNORECASE
                  )

              clean_text = re.sub(r"<[^>]+>", " ", clean_text)
              clean_text = html_lib.unescape(clean_text)
              clean_text = re.sub(r"\s+", " ", clean_text).strip()

              print("Extracted text length:", len(clean_text))
              print("Extracted text preview:", clean_text[:500])
              
              # PlayStation記事の本文領域を調査
              for tag_name in ("main", "article"):
                  matches = re.findall(
                      rf"<{tag_name}\b[^>]*>",
                      article_html,
                      re.IGNORECASE
                  )
                  print(f"{tag_name} tags:", matches[:5])

              # 本文らしいHTML要素のclass名を調査
              class_matches = re.findall(
                  r'<(?:div|section)\b[^>]*class=["\']([^"\']+)["\']',
                  article_html,
                  re.IGNORECASE
              )

              content_classes = [
                  name for name in class_matches
                  if any(
                      word in name.lower()
                      for word in ("content", "body", "entry", "post")
                  )
              ]

              print("Content classes:", content_classes[:20])
              
              # PlayStation記事の本文領域だけを抽出
              from html.parser import HTMLParser

              class ArticleBodyParser(HTMLParser):
                  def __init__(self):
                      super().__init__(convert_charrefs=True)
                      self.depth = 0
                      self.parts = []

                  def handle_starttag(self, tag, attrs):
                      classes = dict(attrs).get("class", "").split()
                      if self.depth:
                          self.depth += 1
                      elif "post-single__content" in classes:
                          self.depth = 1

                  def handle_endtag(self, tag):
                      if self.depth:
                          self.depth -= 1

                  def handle_data(self, data):
                      if self.depth:
                          self.parts.append(data)

              parser = ArticleBodyParser()
              parser.feed(article_html)
              body_text = re.sub(
                  r"\s+", " ", " ".join(parser.parts)
              ).strip()

              print("Body text length:", len(body_text))
              print("Body text preview:", body_text[:500])





          if not items:
              raise RuntimeError("No RSS items found")
          PY
