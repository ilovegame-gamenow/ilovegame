name: Test PlayStation Images

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-images:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Inspect RSS image information
        run: |
          node --input-type=module <<'JS'
          import assert from "node:assert/strict";

          const rssUrl =
            "https://blog.ja.playstation.com/feed/";

          const response = await fetch(rssUrl, {
            headers: {
              "User-Agent": "Mozilla/5.0"
            }
          });

          assert.ok(
            response.ok,
            `RSS fetch failed: ${response.status}`
          );

          const xml = await response.text();

          const items =
            xml.match(/<item\b[^>]*>[\s\S]*?<\/item>/gi) || [];

          console.log(`RSS items: ${items.length}`);

          for (const [index, item] of items.slice(0, 3).entries()) {
            console.log(`--- Article ${index + 1} ---`);

            const title =
              item.match(/<title>([\s\S]*?)<\/title>/i);

            console.log(
              `Title: ${title?.[1]?.slice(0, 150) || "Not found"}`
            );

            // 画像に関連するRSSタグ
            const imageTags = item.match(
              /<(?:media:[\w-]+|enclosure)\b[^>]*>/gi
            ) || [];

            console.log(
              `Image-related tags: ${imageTags.length}`
            );

            for (const tag of imageTags.slice(0, 10)) {
              console.log(tag.slice(0, 500));
            }

            // 記事本文や概要に含まれる画像
            const imageUrls = [
              ...item.matchAll(
                /<img\b[^>]*\bsrc=["']([^"']+)["']/gi
              )
            ];

            console.log(
              `HTML img tags: ${imageUrls.length}`
            );

            for (const match of imageUrls.slice(0, 3)) {
              console.log(`Image URL: ${match[1]}`);
            }

            // WordPress系の画像フィールドを確認
            const fieldNames = [
              ...item.matchAll(
                /<([\w:-]+)(?:\s[^>]*)?>/g
              )
            ]
              .map(match => match[1])
              .filter(name =>
                /image|thumb|media|enclosure/i.test(name)
              );

            console.log(
              `Image-related fields: ${[...new Set(fieldNames)].join(", ") || "None"}`
            );
          }

          console.log("RSS image inspection completed.");
          JS
