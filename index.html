<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>I LOVE GAME♪ — ゲームの「今」をお届け♪</title>
<link rel="stylesheet" href="/site-home.css">
<link rel="stylesheet" href="/header.css">
<link rel="stylesheet" href="/news-card.css">
<link rel="stylesheet" href="/pagination.css">
</head>
<body>
<header></header>
<main>
<section id="breaking" class="breaking">
  <div class="breaking-label">● BREAKING / 速報</div>
  <img id="breaking-image" alt="" hidden>
  <h1 id="breaking-title">速報をチェック中...</h1>
  <div id="breaking-meta" class="meta"></div>
</section>

<div class="section-title" id="latest">
  <h2>🔥 NEWS</h2>
  <span>最新ゲームニュース</span>
</div>

<section class="grid">
  <p class="loading-message">ニュースを読み込み中...</p>
</section>

<div class="section-title" id="pickup-heading">
  <h2>🎮 PICK UP</h2>
  <span>注目ニュース</span>
</div>

<section id="pickup" class="pickup"></section>

<div id="pagination" class="pagination"></div>
</main>

<footer><div class="footer-logo">I <span>LOVE</span> GAME<span class="music">♪</span></div>ゲームの「今」をお届け♪</footer>
<script src="/header.js"></script>
<script src="/date-utils.js"></script>
<script src="/image-utils.js"></script>
<script src="/news-card.js"></script>
<script src="/featured-news.js"></script>
<script src="/pagination.js"></script>
<script>

async function loadLiveNews(){
  try{
    const params = new URLSearchParams(location.search);
    const requestedPage = Math.max(1, parseInt(params.get("page") || "1", 10) || 1);
    const [r, featuredResponse] = await Promise.all([
  fetch(`/api/news?page=${requestedPage}`),
  fetch("/api/featured-news")
]);
await GameDate.ready;
const [result, featuredResult] = await Promise.all([
  r.ok ? r.json() : Promise.reject(new Error("記事を取得できませんでした")),
  featuredResponse.ok ? featuredResponse.json() : Promise.reject(new Error("注目記事を取得できませんでした"))
]);
const rows = result.articles || [];
    

GameFeatured.render(featuredResult);
    const latest = document.querySelector(".news-grid,.grid");
    const pagination = document.getElementById("pagination");
    if(!latest || !pagination) return;

    const perPage = result.limit || 20;
    const totalPages = Math.max(1, Math.ceil(result.total / perPage));
    const currentPage = result.page || requestedPage;
    if (currentPage !== requestedPage) {
      const correctedUrl = new URL(location.href);
      correctedUrl.searchParams.set("page", String(currentPage));
      history.replaceState(null, "", correctedUrl);
    }
    const pageRows = rows;
    
latest.innerHTML = pageRows
  .map(article => GameNewsCard.render(article))
  .join("");

    pagination.replaceChildren(
  GamePagination.render(currentPage, totalPages, page => {
    location.href = `?page=${page}#latest`;
  })
);

  }catch(e){
    console.error(e);
    alert("Supabase接続エラー: " + e.message);
  }
}
loadLiveNews();
</script>
  
</body>
</html>
