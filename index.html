<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>I LOVE GAME♪ — ゲームの「今」をお届け♪</title>
<link rel="stylesheet" href="/site-home.css">
<link rel="stylesheet" href="/header.css">
<link rel="stylesheet" href="/news-card.css">
<link rel="stylesheet" href="/pagination.css">
<link rel="stylesheet" href="/release-cards.css">
<link rel="stylesheet" href="/weekly-roundup.css">
<link rel="stylesheet" href="/platform-display.css">
</head>
<body>
<header></header>
<main>
<section id="breaking" class="breaking" hidden></section>

<section id="weeklyReleases" class="weekly-section" aria-labelledby="weekHeading">
  <div class="weekly-heading"><h2 id="weekHeading">今週発売のゲーム</h2></div>
  <p class="week-note"><span id="weekRange"></span>日本発売・月曜〜日曜</p>
  <p id="weeklyDemo" class="weekly-demo" hidden>週まとめ記事の構成見本です。</p>
  <div id="weekList"><a id="calendarLink" class="weekly-overview" href="/weekly-roundup.html"><strong id="weekTitle" class="weekly-title">今週の発売タイトルまとめ！</strong><span id="weeklyEmpty" class="weekly-empty">発売情報は確認できた作品から追加します。</span><span id="weekHighlights" class="weekly-highlights"></span></a></div>
  <div class="weekly-status"><p id="weekMessage" role="status" aria-live="polite">発売情報を確認中…</p><button id="retryWeek" type="button" hidden>再読み込み</button></div>
</section>

<div class="section-title" id="pickup-heading">
  <h2>注目のゲーム</h2>
  <span>面白いゲームとの出会いを♪</span>
</div>

<section id="pickup" class="pickup" aria-live="polite"><p class="meta featured-status">注目のゲームを読み込み中…</p></section>
<div id="pickup-controls" class="pickup-controls" hidden>
  <button id="pickup-prev" type="button" aria-label="前の注目ゲームを表示" aria-controls="pickup">‹</button>
  <div id="pickup-dots" class="pickup-dots" aria-label="注目ゲームの表示位置"></div>
  <button id="pickup-next" type="button" aria-label="次の注目ゲームを表示" aria-controls="pickup">›</button>
  <span class="pickup-hint">横にスワイプしてチェック →</span>
</div>
<div id="featured-retry" class="featured-retry" hidden><button type="button">再読み込み</button></div>

<div class="section-title" id="latest">
  <h2>最新ニュース</h2>
  <span>ゲームの新情報を新しい順に</span>
</div>

<section class="grid">
  <p class="loading-message">ニュースを読み込み中...</p>
</section>

<div id="pagination" class="pagination"></div>

</main>

<footer><div class="footer-logo">I <span>LOVE</span> GAME<span class="music">♪</span></div>ゲームの「今」をお届け♪</footer>
<script src="/platform-display.js"></script>
<script src="/header.js"></script>
<script src="/date-utils.js"></script>
<script src="/image-utils.js"></script>
<script src="/news-card.js"></script>
<script src="/pickup-carousel.js"></script>
<script src="/featured-news.js"></script>
<script src="/featured-news-client.js"></script>
<script src="/pagination.js"></script>
<script type="module" src="/weekly-releases.js"></script>
<script>

async function loadLiveNews(){
  try{
    const params = new URLSearchParams(location.search);
    const requestedPage = Math.max(1, parseInt(params.get("page") || "1", 10) || 1);
    const r = await fetch(`/api/news?page=${requestedPage}`);
    if (!r.ok) throw new Error("記事を取得できませんでした");
    const result = await r.json();
    const rows = result.articles || [];

    const latest = document.querySelector(".news-grid,.grid");
    const pagination = document.getElementById("pagination");
    if(!latest || !pagination) return;

    const perPage = result.limit || 20;
    const totalPages = Math.max(1, Math.ceil(result.total / perPage));
    const currentPage = result.page || requestedPage;
    if (currentPage !== requestedPage) {
      const correctedUrl = new URL(location.href);
      correctedUrl.searchParams.set("page", String(currentPage));
      history.replaceState(null, "", correctedUrl);
    }
    const pageRows = rows;
    
latest.innerHTML = pageRows
  .map(article => GameNewsCard.render(article))
  .join("");

    pagination.replaceChildren(
  GamePagination.render(currentPage, totalPages, page => {
    location.href = `?page=${page}#latest`;
  })
);

  }catch(e){
    console.error(e);
    alert("Supabase接続エラー: " + e.message);
  }
}
loadLiveNews();
</script>
  
</body>
</html>
