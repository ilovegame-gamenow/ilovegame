<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>I LOVE GAME♪ — ゲームの「今」をお届け♪</title>
<link rel="stylesheet" href="/site-home.css">
<link rel="stylesheet" href="/header.css">
<link rel="stylesheet" href="/news-card.css">
<link rel="stylesheet" href="/news-feed.css">
<link rel="stylesheet" href="/pagination.css">
<link rel="stylesheet" href="/release-cards.css">
<link rel="stylesheet" href="/weekly-roundup.css">
<link rel="stylesheet" href="/platform-display.css">
</head>
<body>
<header></header>
<main>
<section id="breaking" class="breaking" hidden></section>

<section id="weeklyReleases" class="weekly-section" aria-labelledby="weekHeading">
  <div class="section-title weekly-heading"><h2 id="weekHeading"><svg class="section-icon" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M7 6h10c2 0 3 1.5 3.4 3.5l1.1 7c.4 2.3-2 3.3-3.5 1.7L15.5 16h-7L6 18.2c-1.5 1.6-3.9.6-3.5-1.7l1.1-7C4 7.5 5 6 7 6Z"/><path d="M7.5 9v5M5 11.5h5M16 10h.01M18.5 13h.01"/></svg>NEW RELEASES <span class="section-subtitle">今週発売のゲーム</span></h2><p class="week-note"><span id="weekRange" class="section-subtitle"></span></p></div>
  <p id="weeklyDemo" class="weekly-demo" hidden>週まとめ記事の構成見本です。</p>
  <div id="weekList"><a id="calendarLink" class="weekly-overview" href="/weekly-roundup.html"><strong id="weekTitle" class="weekly-title">今週の発売タイトルまとめ！</strong><span id="weeklyEmpty" class="weekly-empty">発売情報は確認できた作品から追加します。</span><span id="weekHighlights" class="weekly-highlights"></span></a></div>
  <div id="weekStatus" class="weekly-status"><p id="weekMessage" role="status" aria-live="polite">発売情報を確認中…</p><button id="retryWeek" type="button" hidden>再読み込み</button></div>
</section>

<div class="section-title" id="pickup-heading">
  <h2><svg class="section-icon" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m12 3 2.8 5.7 6.3.9-4.6 4.5 1.1 6.3-5.6-3-5.6 3 1.1-6.3L2.9 9.6l6.3-.9L12 3Z"/></svg>PICK UP <span class="section-subtitle">注目記事</span></h2>
</div>

<section id="pickup" class="pickup" aria-live="polite"><p class="meta featured-status">注目の記事を読み込み中…</p></section>
<div id="pickup-controls" class="pickup-controls" hidden>
  <button id="pickup-prev" type="button" aria-label="前の注目記事を表示" aria-controls="pickup">‹</button>
  <div id="pickup-dots" class="pickup-dots" aria-label="注目記事の表示位置"></div>
  <button id="pickup-next" type="button" aria-label="次の注目記事を表示" aria-controls="pickup">›</button>
  <span class="pickup-hint">横にスワイプしてチェック →</span>
</div>
<div id="featured-retry" class="featured-retry" hidden><button type="button">再読み込み</button></div>

<div class="section-title feed-heading" id="latest">
  <h2><svg class="section-icon" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M5 8H3v11a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V3H7v16a2 2 0 0 1-2 2"/><path d="M11 7h6v4h-6zM11 15h6M11 18h4"/></svg>NEWS FEED <span class="section-subtitle">新着記事</span></h2>
<div class="feed-options"><label>速報・注目も含める <input id="feed-include" type="checkbox"></label></div>
</div>

<div class="feed-tools">
<form id="feed-search" role="search"><label class="sr-only" for="feed-query">ゲーム名・記事タイトルで検索</label><input id="feed-query" type="search" maxlength="100" placeholder="ゲーム名・記事タイトルで検索"><button type="submit">検索</button><button id="feed-clear" type="button" hidden>解除</button></form>
<div class="feed-toolbar">
<div id="feed-filters" class="feed-filters" role="group" aria-label="ニュースのカテゴリー"><button type="button" data-filter="all" aria-pressed="true">ALL</button><button type="button" data-filter="switch" aria-pressed="false">Switch</button><button type="button" data-filter="playstation" aria-pressed="false">PlayStation</button><button type="button" data-filter="xbox" aria-pressed="false">Xbox</button><button type="button" data-filter="pc" aria-pressed="false">PC</button><button type="button" data-filter="mobile" aria-pressed="false">Mobile</button><button type="button" data-filter="movie" aria-pressed="false">MOVIE</button></div>
</div>
<p id="feed-search-note" class="meta" hidden>全公開記事から検索中</p>
</div>
<section class="grid news-feed" aria-label="NEWS FEED" aria-live="polite">
  <p class="loading-message">ニュースを読み込み中...</p>
</section>

<div id="pagination" class="pagination"></div>

</main>

<footer><div class="footer-logo">I <span>LOVE</span> GAME<span class="music">♪</span></div>ゲームの「今」をお届け♪</footer>
<script src="/platform-display.js"></script>
<script src="/header.js"></script>
<script src="/date-utils.js"></script>
<script src="/image-utils.js"></script>
<script src="/news-card.js"></script>
<script src="/pickup-carousel.js"></script>
<script src="/featured-news.js"></script>

<script src="/pagination.js"></script>
<script type="module" src="/weekly-releases.js"></script>
<script src="/home-news.js"></script>
  
</body>
</html>
