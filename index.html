<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>I LOVE GAME♪ — ゲームの「今」をお届け♪</title>
<style>
*{box-sizing:border-box}
:root{
  --orange:#ff7a2f;
  --orange2:#ff9a55;
  --cream:#fff8f0;
  --ink:#24201d;
  --muted:#77706a;
  --line:#eee2d7;
  --white:#fff;
}
body{
  margin:0;color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
  background:var(--cream);
}

main{max-width:1100px;margin:0 auto;padding:28px 20px 65px}
.breaking{
  background:var(--white);border:2px solid var(--orange);border-radius:22px;
  padding:23px 25px;margin-bottom:30px;position:relative;
  box-shadow:7px 7px 0 #ffd9c2;
}
.breaking:after{
  content:"";position:absolute;right:20px;top:-12px;width:25px;height:25px;
  background:var(--orange);border-radius:8px;transform:rotate(14deg);
}
.breaking-label{font-weight:1000;color:var(--orange);font-size:13px;margin-bottom:8px}
.breaking h1{font-size:28px;margin:0 0 8px;line-height:1.35}
.meta{font-size:12px;color:var(--muted)}
.section-title{
  display:flex;align-items:end;justify-content:space-between;
  margin:30px 0 12px;border-bottom:2px solid var(--line);padding-bottom:9px;
}
.section-title h2{margin:0;font-size:21px;font-weight:1000}
.section-title span{font-size:11px;color:var(--muted);font-weight:700}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.card{
  background:var(--white);border:1px solid var(--line);border-radius:18px;
  padding:17px;min-height:150px;box-shadow:0 4px 14px #d78f6317;
  transition:transform .15s ease,box-shadow .15s ease;
}
.card:hover{transform:translateY(-3px);box-shadow:0 8px 20px #d78f6326}
.time{font-size:11px;color:var(--orange);font-weight:900;margin-bottom:9px}
.card h3{font-size:16px;line-height:1.5;margin:0 0 12px}
.tag{
  display:inline-block;font-size:10px;font-weight:800;color:#8a4b28;
  background:#fff0e5;border:1px solid #ffd5bd;border-radius:999px;padding:4px 8px;
}
.pickup{display:grid;grid-template-columns:1.5fr 1fr 1fr;gap:14px}
.pickup .card:first-child{min-height:210px;background:#fff3e8;border-color:#ffc8a5}
.pickup .card:first-child h3{font-size:21px}
.pickup .card:first-child .time{font-size:13px;letter-spacing:.08em}
footer{background:#25211e;color:#fff;padding:30px;text-align:center;font-size:12px}
.footer-logo{font-size:20px;font-weight:1000;margin-bottom:5px}
.footer-logo span{color:var(--orange2)}
@media(max-width:800px){
  .grid{grid-template-columns:1fr 1fr}.pickup{grid-template-columns:1fr 1fr}
  .pickup .card:first-child{grid-column:1/-1}
}

@media(max-width:600px){
  .grid,.pickup{grid-template-columns:1fr}
  .breaking h1{font-size:22px}
}
  
.archive{min-height:120px}\n
/* --- I LOVE GAME♪ live-news additions --- */
.platforms{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.platform{font-size:11px;font-weight:900;padding:5px 8px;border-radius:999px;color:#fff;letter-spacing:.02em}
.platform.switch,.platform.switch2{background:#e60012}
.platform.ps5{background:#1674d1}
.platform.xbox{background:#107c10}
.platform.pc{background:#5d6470}
.platform.mobile{background:#8e44ad}
.platform.other{background:#ff7a2f}
.thumb{width:100%;aspect-ratio:16/9;border-radius:14px;object-fit:cover;background:linear-gradient(135deg,#ffe2cc,#fff3e8);display:block;margin-bottom:12px}
.thumb-placeholder{width:100%;aspect-ratio:16/9;border-radius:14px;background:linear-gradient(135deg,#ff7a2f,#ffb36f);display:grid;place-items:center;color:#fff;font-weight:1000;font-size:22px;margin-bottom:12px}
.live-note{max-width:1120px;margin:10px auto 0;padding:0 20px;color:#8a817a;font-size:12px}
.pagination{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
  margin:32px 0 10px;
}
.pagination button{
  border:0;
  background:#fff3e9;
  color:var(--ink);
  padding:9px 13px;
  border-radius:999px;
  font-weight:800;
  cursor:pointer;
}
.pagination button.active{
  background:var(--orange);
  color:#fff;
}
.pagination button:disabled{
  opacity:.35;
  cursor:default;
}
</style>
<link rel="stylesheet" href="/header.css">
</head>
<body>
<header></header>
<main>
<section id="breaking" class="breaking">
  <div class="breaking-label">● BREAKING / 速報</div>
  <h1 id="breaking-title">速報をチェック中...</h1>
<div id="breaking-meta" class="meta"></div>
</section>

<div class="section-title" id="latest">
  <h2>🔥 NEWS</h2>
  <span>最新ゲームニュース</span>
</div>

<section class="grid">
  <p class="loading-message">ニュースを読み込み中...</p>
</section>

<div class="section-title">
  <h2>🎮 PICK UP</h2>
  <span>注目ニュース</span>
</div>

<section id="pickup" class="pickup"></section>

<div id="pagination" class="pagination"></div>
</main>

<footer><div class="footer-logo">I <span>LOVE</span> GAME<span class="music">♪</span></div>ゲームの「今」をお届け♪</footer>
<script src="/header.js"></script>
<script src="/date-utils.js"></script>
<script>
/*
 I LOVE GAME♪ live data hook
 次の工程で SUPABASE_ANON_KEY を設定すると、published の記事を自動取得します。
 anon key はブラウザ公開用のキーです。service_role key は絶対に入れないでください。
*/

function platformClass(name){
  const n=(name||"").toLowerCase();
  if(n.includes("switch 2")) return "switch2";
  if(n.includes("switch")) return "switch";
  if(n.includes("ps5") || n.includes("playstation")) return "ps5";
  if(n.includes("xbox")) return "xbox";
  if(n.includes("pc") || n.includes("steam")) return "pc";
  if(n.includes("ios") || n.includes("android") || n.includes("スマホ") || n.includes("mobile")) return "mobile";
  return "other";
}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));}
async function loadLiveNews(){
  try{
    const params = new URLSearchParams(location.search);
    const requestedPage = Math.max(1, parseInt(params.get("page") || "1", 10) || 1);
    const r = await fetch(`/api/news?page=${requestedPage}`);
    const result = await r.json();
    const rows = result.articles || [];
    const configResponse = await fetch("/api/site-config");
const siteConfig = configResponse.ok
  ? await configResponse.json()
  : { pickupThreshold: 80, maxPickupArticles: 3 };
    if(!rows.length) return;
    const now = Date.now();
const fortyEightHoursAgo = now - (48 * 60 * 60 * 1000);
const newsRows = rows.filter(a => !String(a.title || "").includes("テスト") && !String(a.source_name || "").includes("I LOVE GAME"));
const recentRows = newsRows.filter(a => {
  const date = a.site_published_at || a.created_at || a.published_at;
  return date && new Date(date).getTime() >= fortyEightHoursAgo;
});

const breaking = [...recentRows]
  .sort((a,b) => (b.importance || 0) - (a.importance || 0))[0];
if(breaking){
  document.getElementById("breaking-title").textContent = breaking.title || "";
  document.getElementById("breaking-meta").textContent =
    `${breaking.source_name || "I LOVE GAME♪"} ｜ 注目度 ${breaking.importance || 0}`;
} else {
    document.getElementById("breaking-title").textContent =
        "現在、新しい速報はありません…";
    document.getElementById("breaking-meta").textContent = "";
}
    if(breaking){
  const breakingBox = document.getElementById("breaking");
  breakingBox.style.cursor = "pointer";
  breakingBox.onclick = () => {
    location.href = `article.html?id=${encodeURIComponent(breaking.id)}`;
  };
}
    const pickup = document.getElementById("pickup");
const pickupRows = [...newsRows]
  .filter(a => (!breaking || a.id !== breaking.id) && Number(a.importance || 0) >= siteConfig.pickupThreshold)
  .sort((a,b) => (b.importance || 0) - (a.importance || 0))
  .slice(0, siteConfig.maxPickupArticles);
    if(pickup){
      const pickupTitle = pickup.previousElementSibling;
if(pickupTitle) pickupTitle.style.display = pickupRows.length ? "" : "none";
  pickup.innerHTML = pickupRows.map(a => `
    <article class="card" onclick="location.href='article.html?id=${encodeURIComponent(a.id)}'" style="cursor:pointer">
      <div class="time">PICK UP</div>
      <h3>${esc(a.title || "")}</h3>
      <p class="meta">${esc(a.summary || "")}</p>
      <span class="tag">注目度 ${a.importance || 0}</span>
    </article>
  `).join("");
}
    const latest = document.querySelector(".news-grid,.grid");
    const pagination = document.getElementById("pagination");
    if(!latest || !pagination) return;

    const perPage = result.limit || 20;
    const totalPages = Math.max(1, Math.ceil(result.total / perPage));
    const currentPage = requestedPage;
    const pageRows = rows;

    latest.innerHTML = pageRows.map(a=>{
      const ps = Array.isArray(a.platforms) ? a.platforms : [];
      const badges = ps.map(p=>`<span class="platform ${platformClass(p)}">${esc(p)}</span>`).join("");
      const updateTime = a.site_published_at || a.created_at || a.published_at;
      const updateLabel = GameDate.format(updateTime);
      const timeColor = GameDate.color(updateTime);
      return `<article class="card" onclick="location.href='article.html?id=${encodeURIComponent(a.id)}'" style="cursor:pointer">
        ${a.thumbnail_url ? `<img class="thumb" src="https://assets.topics.apps-jp.nintendo.com/image/${esc(a.thumbnail_url)}" alt="${esc(a.title)}">` : `<div class="thumb-placeholder">I LOVE GAME♪</div>`}
        <div class="meta">${esc(a.source_name||"")}</div>
        <div class="time game-date" style="color:${timeColor}">${esc(updateLabel)} UP</div>
        <h3>${esc(a.title)}</h3>
        <p>${esc(a.summary||"")}</p>
        <div class="platforms">${badges}</div>
      </article>`;
    }).join("");

    let html = "";

    html += `<button ${currentPage===1 ? "disabled" : ""} onclick="location.href='?page=${currentPage-1}#latest'">‹ 新しい記事</button>`;

    for(let i=1; i<=totalPages; i++){
      html += `<button class="${i===currentPage ? "active" : ""}" onclick="location.href='?page=${i}#latest'">${i}</button>`;
    }

    html += `<button ${currentPage===totalPages ? "disabled" : ""} onclick="location.href='?page=${currentPage+1}#latest'">古い記事 ›</button>`;

    pagination.innerHTML = html;

  }catch(e){
    console.error(e);
    alert("Supabase接続エラー: " + e.message);
  }
}
loadLiveNews();
</script>
  
</body>
</html>
